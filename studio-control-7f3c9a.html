<style>
:root{color-scheme:dark;--bg:#080a0e;--panel:#10141b;--line:#ffffff17;--text:#f7f8fc;--muted:#a6adbb;--lime:#d9ff72;--violet:#a99aff;--cyan:#72e7ff}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{min-height:100%;background:var(--bg);-webkit-user-select:none;user-select:none}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:clamp(18px,4vw,48px);font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;color:var(--text);background:radial-gradient(ellipse at 12% 8%,#a99aff1c,transparent 34%),radial-gradient(ellipse at 88% 92%,#d9ff7210,transparent 32%),linear-gradient(145deg,#090b10,#07080c 70%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,black,transparent 88%)}
main{width:min(900px,100%);position:relative}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.2vw,20px)}
a{--accent:var(--lime);position:relative;isolation:isolate;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:112px;padding:clamp(18px,3vw,27px);border:1px solid var(--line);border-radius:22px;text-decoration:none;color:var(--text);background:linear-gradient(135deg,#ffffff0b,#ffffff03 55%),var(--panel);box-shadow:0 12px 35px #0000001f;overflow:hidden;transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease,background .28s ease;animation:rise .65s both;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
a:nth-child(2){--accent:var(--violet);animation-delay:.05s}a:nth-child(3){--accent:var(--cyan);animation-delay:.1s}a:nth-child(4){--accent:#ffb86b;animation-delay:.15s}a:nth-child(5){--accent:#ff8cba;animation-delay:.2s}a:nth-child(6){--accent:#b4f4c8;animation-delay:.25s}
a:before{content:"";position:absolute;z-index:-1;width:180px;height:180px;left:-75px;top:-105px;border-radius:50%;background:var(--accent);filter:blur(75px);opacity:.10;transition:opacity .28s}
a:after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid transparent;background:linear-gradient(125deg,color-mix(in srgb,var(--accent) 45%,transparent),transparent 38%,transparent 70%,color-mix(in srgb,var(--accent) 22%,transparent)) border-box;mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);mask-composite:exclude;opacity:.45;pointer-events:none}
a:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 20px 45px #0005,0 0 28px color-mix(in srgb,var(--accent) 10%,transparent);background:linear-gradient(135deg,#ffffff0d,#ffffff04 55%),#131720}
a:hover:before{opacity:.22}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.label{font-size:clamp(14px,2vw,17px);font-weight:650;line-height:1.8;letter-spacing:-.2px;pointer-events:none}
.iconbox{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border-radius:15px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);transition:transform .28s ease,background .28s ease;pointer-events:none}
.iconbox svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
a:hover .iconbox{transform:scale(1.08) rotate(-4deg);background:color-mix(in srgb,var(--accent) 14%,transparent)}
@keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:560px){body{padding:18px}.grid{grid-template-columns:1fr;gap:12px}a{min-height:86px;border-radius:18px;padding:17px 19px}.iconbox{width:44px;height:44px;flex-basis:44px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>

<script>
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("copy",e=>e.preventDefault());
document.addEventListener("cut",e=>e.preventDefault());
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["a","c","x","u","s","p"].includes(e.key.toLowerCase()))e.preventDefault();});
