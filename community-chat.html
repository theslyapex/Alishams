function queueReactionRefresh(ids){

  const batch=[...reactionRefreshQueue];reactionRefreshQueue.clear();reactionRefreshTimer=null;
  if(!batch.length)return;
  const {data,error}=await sb.from("community_message_reactions").select("message_id,user_id,emoji").in("message_id",batch);
  if(error)return;
  const grouped={};(data||[]).forEach(r=>{(grouped[r.message_id]??=[]).push(r)});
  batch.forEach(id=>{
   const node=$("messages").querySelector('[data-id="'+id+'"]'),strip=node?.querySelector(".reaction-strip");if(!strip)return;

   strip.querySelectorAll(".reaction-pill").forEach(b=>b.onclick=()=>react(b.dataset.id,b.dataset.emoji));
  });
 },60);
}

 if(lookupError){toast("وضعیت واکنش دریافت نشد");return}
 if(existing){const {error}=await sb.from("community_message_reactions").delete().eq("id",existing.id).eq("user_id",user.id);if(error){toast("حذف واکنش انجام نشد");return}toast("واکنش شما برداشته شد")}
 else{const {error}=await sb.from("community_message_reactions").insert({message_id:id,user_id:user.id,emoji});if(error&&error.code!=="23505"){toast("ثبت واکنش انجام نشد");return}toast("واکنش ثبت شد")}
 queueReactionRefresh(id);
}
async function report(id){const reason=prompt("دلیل گزارش این پیام را بنویسید:");if(!reason||reason.trim().length<2)return;const {error}=await sb.from("community_message_reports").insert({message_id:id,reporter_id:user.id,reason:reason.trim().slice(0,500)});toast(error?(error.code==="23505"?"این پیام را قبلاً گزارش کرده‌اید":"ثبت گزارش ناموفق بود"):"گزارش شما ثبت شد؛ سپاس از همراهی‌تان")}
async function edit(m){const value=prompt("متن ویرایش‌شده پیام:",m.body);if(value===null||!value.trim()||value.trim().length>5000)return;const {error}=await sb.from("community_messages").update({body:value.trim(),edited_at:new Date().toISOString()}).eq("id",m.id).eq("user_id",user.id);toast(error?"ویرایش پیام ناموفق بود":"پیام ویرایش شد")}
function askDelete(){return new Promise(resolve=>{const modal=$("confirmBackdrop");modal.classList.add("open");const finish=value=>{modal.classList.remove("open");$("confirmAccept").onclick=null;$("confirmCancel").onclick=null;modal.onclick=null;resolve(value)};$("confirmAccept").onclick=()=>finish(true);$("confirmCancel").onclick=()=>finish(false);modal.onclick=e=>{if(e.target===modal)finish(false)}})}
async function remove(m){
 if(!await askDelete())return;
 if(isAdmin){
  if(m.attachment_path){const {error:storageError}=await sb.storage.from("community-chat").remove([m.attachment_path]);if(storageError){toast("حذف فایل پیوست انجام نشد");return}}
  const {error}=await sb.from("community_messages").delete().eq("id",m.id);
  toast(error?"حذف پیام ناموفق بود":"پیام و پیوست آن به‌طور کامل حذف شد");
 }else{
  const {error}=await sb.from("community_messages").update({deleted_at:new Date().toISOString(),body:"پیام حذف شد"}).eq("id",m.id).eq("user_id",user.id);
  toast(error?"حذف پیام ناموفق بود":"پیام حذف شد");
 }
}
$("voiceBtn").onclick=async()=>{if(recording){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast("ضبط صدا در این مرورگر پشتیبانی نمی‌شود");return}try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recorder=new MediaRecorder(mediaStream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});mediaStream.getTracks().forEach(t=>t.stop());recording=false;$("voiceBtn").classList.remove("recording");$("voiceBtn").textContent="🎙";if(blob.size>10*1048576){toast("حجم پیام صوتی بیشتر از ۱۰ مگابایت است");return}const ext=blob.type.includes("mp4")?"m4a":"webm";await uploadFile(new File([blob],"voice-"+Date.now()+"."+ext,{type:blob.type}),"voice")};recorder.start();recording=true;$("voiceBtn").classList.add("recording");$("voiceBtn").textContent="■";toast("در حال ضبط؛ برای پایان دوباره دکمه را بزنید")}catch(e){toast("دسترسی به میکروفون داده نشد")}};
async function runMessageSearch(rawTerm){
 const term=rawTerm.trim(),requestId=++searchRequestId;
 if(term.length<2){isSearching=false;clearTimeout(searchTimer);await loadMessages();$("subline").textContent="گفتگوی زنده اعضا · اتصال برقرار است";return}
 isSearching=true;$("messages").innerHTML='<div class="loading">در حال جست‌وجو در پیام‌ها…</div>';$("subline").textContent="نتایج جست‌وجو برای «"+esc(term)+"»";
 const {data,error}=await sb.from("community_messages").select("*").ilike("body","%"+term+"%").is("deleted_at",null).order("created_at",{ascending:false}).limit(100);
 if(requestId!==searchRequestId)return;
 if(error){$("messages").innerHTML='<div class="empty"><div><strong>جست‌وجو انجام نشد</strong>لطفاً دوباره تلاش کنید.</div></div>';toast("جست‌وجو انجام نشد");return}
 const rows=(data||[]).reverse();$("messages").innerHTML="";
 for(const m of rows){if(requestId!==searchRequestId)return;await renderMessage(m)}
 if(!rows.length)$("messages").innerHTML='<div class="empty"><div><strong>نتیجه‌ای پیدا نشد</strong>عبارت دیگری را امتحان کنید.</div></div>';
 $("messages").scrollTop=0;$("subline").textContent=rows.length+" نتیجه برای «"+term+"»";
}
$("searchMessages").addEventListener("input",e=>{clearTimeout(searchTimer);const term=e.target.value.trim();if(!term){searchRequestId++;isSearching=false;runMessageSearch("");return}if(term.length<2){isSearching=false;return}$("subline").textContent="در حال آماده‌سازی جست‌وجو…";searchTimer=setTimeout(()=>runMessageSearch(term),350)});
$("searchMessages").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(searchTimer);runMessageSearch(e.target.value)}if(e.key==="Escape"){e.target.value="";clearTimeout(searchTimer);searchRequestId++;isSearching=false;runMessageSearch("")}});
document.addEventListener("contextmenu",e=>{if(!e.target.closest("#messages"))e.preventDefault()});document.addEventListener("selectstart",e=>{if(!e.target.closest("#messages")&&!e.target.closest("input,textarea"))e.preventDefault()});document.addEventListener("dragstart",e=>{if(!e.target.closest("#messages"))e.preventDefault()});
window.addEventListener("beforeunload",()=>{if(channel)sb.removeChannel(channel);if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop())});
})().catch(error=>{
 console.error("Community page initialization failed:",error);
 const app=document.getElementById("app");
 if(app)app.innerHTML='<section class="gate"><div class="symbol">!</div><h1>بارگذاری انجمن انجام نشد</h1><p>'+String(error?.message||"خطای ناشناخته").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+'</p><button type="button" onclick="location.reload()" style="margin-top:12px;background:#d9ff72;color:#15200d;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:800">تلاش دوباره</button></section>';
});
</script>
</body></html>
