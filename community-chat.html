function renderAttachment(m,url){if(!url)return "";const mime=m.attachment_mime||"",name=esc(m.attachment_name||"فایل پیوست");if(m.message_type==="image")return '<a class="attachment" href="'+url+'" target="_blank"><img src="'+url+'" alt="'+name+'" loading="lazy"></a>';if(m.message_type==="video")return '<div class="attachment"><video src="'+url+'" controls playsinline preload="metadata"></video></div>';if(m.message_type==="audio"||m.message_type==="voice")return '<div class="attachment"><audio src="'+url+'" controls preload="metadata"></audio></div>';return '<a class="file-card" href="'+url+'" target="_blank" rel="noopener"><span style="font-size:25px">📎</span><span><b>'+name+'</b><small>'+size(m.attachment_size||0)+'</small></span></a>'}

async function sendText(){const text=$("messageInput").value.trim();if(!text)return;const btn=$("sendBtn");btn.disabled=true;const {data:sent,error}=await sb.from("community_messages").insert({user_id:user.id,body:text,message_type:"text",reply_to:replyTarget?.id||null}).select().single();btn.disabled=false;if(error){toast("ارسال پیام انجام نشد: "+error.message);return}if(sent)await renderMessage(sent);$("messages").scrollTop=$("messages").scrollHeight;$("messageInput").value="";$("messageInput").style.height="auto";clearReply();$("emojiPanel").style.display="none"}
$("fileInput").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;e.target.value="";let type=f.type.startsWith("image/")?"image":f.type.startsWith("video/")?"video":f.type.startsWith("audio/")?"audio":"file";const limits={image:10,video:50,audio:20,file:25};if(f.size>limits[type]*1048576){toast("حداکثر حجم مجاز این نوع فایل "+limits[type]+" مگابایت است");return}if(!f.type){toast("نوع این فایل پشتیبانی نمی‌شود");return}await uploadFile(f,type)};
async function uploadFile(f,type){toast("در حال بارگذاری فایل…");const path=user.id+"/"+Date.now()+"-"+crypto.randomUUID()+"-"+f.name.replace(/[^\w.\-\u0600-\u06FF]/g,"_");const {error:upErr}=await sb.storage.from("community-chat").upload(path,f,{contentType:f.type,upsert:false});if(upErr){toast("بارگذاری ناموفق بود: "+upErr.message);return}const {data:sent,error}=await sb.from("community_messages").insert({user_id:user.id,body:"",message_type:type,attachment_path:path,attachment_name:f.name,attachment_mime:f.type,attachment_size:f.size,reply_to:replyTarget?.id||null}).select().single();if(error){await sb.storage.from("community-chat").remove([path]);toast("ثبت فایل در گفتگو ناموفق بود");return}if(sent)await renderMessage(sent);$("messages").scrollTop=$("messages").scrollHeight;clearReply();toast("فایل ارسال شد") }
async function react(id){const {error}=await sb.from("community_message_reactions").insert({message_id:id,user_id:user.id,emoji:"❤️"});if(error&&error.code!=="23505")toast("ثبت واکنش انجام نشد");else toast("واکنش ثبت شد")}
async function report(id){const reason=prompt("دلیل گزارش این پیام را بنویسید:");if(!reason||reason.trim().length<2)return;const {error}=await sb.from("community_message_reports").insert({message_id:id,reporter_id:user.id,reason:reason.trim().slice(0,500)});toast(error?(error.code==="23505"?"این پیام را قبلاً گزارش کرده‌اید":"ثبت گزارش ناموفق بود"):"گزارش شما ثبت شد؛ سپاس از همراهی‌تان")}
async function edit(m){const value=prompt("متن ویرایش‌شده پیام:",m.body);if(value===null||!value.trim()||value.trim().length>5000)return;const {error}=await sb.from("community_messages").update({body:value.trim(),edited_at:new Date().toISOString()}).eq("id",m.id).eq("user_id",user.id);toast(error?"ویرایش پیام ناموفق بود":"پیام ویرایش شد")}
async function remove(m){if(!confirm("این پیام حذف شود؟"))return;const {error}=await sb.from("community_messages").update({deleted_at:new Date().toISOString(),body:"پیام حذف شد"}).eq("id",m.id).eq("user_id",user.id);toast(error?"حذف پیام ناموفق بود":"پیام حذف شد")}
$("voiceBtn").onclick=async()=>{if(recording){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast("ضبط صدا در این مرورگر پشتیبانی نمی‌شود");return}try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];recorder=new MediaRecorder(mediaStream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});mediaStream.getTracks().forEach(t=>t.stop());recording=false;$("voiceBtn").classList.remove("recording");$("voiceBtn").textContent="🎙";if(blob.size>10*1048576){toast("حجم پیام صوتی بیشتر از ۱۰ مگابایت است");return}const ext=blob.type.includes("mp4")?"m4a":"webm";await uploadFile(new File([blob],"voice-"+Date.now()+"."+ext,{type:blob.type}),"voice")};recorder.start();recording=true;$("voiceBtn").classList.add("recording");$("voiceBtn").textContent="■";toast("در حال ضبط؛ برای پایان دوباره دکمه را بزنید")}catch(e){toast("دسترسی به میکروفون داده نشد")}};
$("searchMessages").addEventListener("keydown",async e=>{if(e.key!=="Enter")return;const term=e.target.value.trim();if(term.length<2)return;const {data,error}=await sb.from("community_messages").select("*").ilike("body","%"+term+"%").is("deleted_at",null).order("created_at",{ascending:false}).limit(40);if(error){toast("جست‌وجو انجام نشد");return}$("messages").innerHTML="";for(const m of (data||[]).reverse())await renderMessage(m);if(!data?.length)$("messages").innerHTML='<div class="empty">نتیجه‌ای پیدا نشد.</div>'});
window.addEventListener("beforeunload",()=>{if(channel)sb.removeChannel(channel);if(mediaStream)mediaStream.getTracks().forEach(t=>t.stop())});
})();
</script>
</body></html>
