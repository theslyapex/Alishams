<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>مدیریت انجمن | Alishams</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><style>
:root{color-scheme:dark;--bg:#0b0b12;--p:#171722;--line:#ffffff18;--txt:#f5f3fc;--muted:#a5a2b5;--lime:#d5f66b;--violet:#aa8dff;--red:#ff7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#aa8dff20,transparent 35%),var(--bg);color:var(--txt);font-family:Vazirmatn,Tahoma,sans-serif}.shell{width:min(1120px,calc(100% - 24px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0;border-bottom:1px solid var(--line)}.brand{font-weight:900}.brand span{color:var(--lime)}a,.btn{color:inherit;text-decoration:none}.btn,button{border:1px solid var(--line);background:#ffffff08;color:var(--txt);padding:9px 13px;border-radius:11px;font:inherit;font-size:12px;cursor:pointer}.hero{padding:26px 0 12px}.hero small{color:var(--lime);font-weight:800}.hero h1{font-size:clamp(25px,4vw,36px);margin:6px 0}.hero p,.muted{color:var(--muted);font-size:12px;line-height:2}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat,.panel,.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#1b1b29,#11111a)}.stat{padding:14px}.stat small{color:var(--muted)}.stat strong{display:block;color:var(--lime);font-size:24px}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tab.active,.primary{background:var(--lime);color:#111;border-color:var(--lime);font-weight:800}.panel{padding:14px;margin-bottom:30px}.toolbar{display:flex;gap:9px}.search{flex:1;min-width:0;background:#0b0b12;border:1px solid var(--line);border-radius:11px;color:#fff;padding:11px}.list{display:grid;gap:10px;margin-top:14px}.card{padding:14px;background:#ffffff04}.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.who{font-size:12px;font-weight:800;overflow-wrap:anywhere}.meta{font-size:10px;color:var(--muted);margin-top:4px}.bodytext{font-size:12px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.badge{font-size:9px;color:var(--lime);border:1px solid #d5f66b55;padding:3px 7px;border-radius:20px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{font-size:10px}.red{color:#ff9eaa;border-color:#ff718555}.violet{color:#cbbaff;border-color:#aa8dff55}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}.notice{display:none;padding:11px;border:1px solid #aa8dff55;border-radius:11px;color:#d6caff;font-size:12px}.notice.show{display:block}.modal{display:none;position:fixed;inset:0;background:#000b;backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{width:min(420px,100%);background:#1b1b29;border:1px solid var(--line);border-radius:18px;padding:18px}.box textarea{width:100%;min-height:80px;background:#0c0c14;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.boxfoot{display:flex;gap:8px;margin-top:10px}.boxfoot button{flex:1}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-wrap:wrap}}

/* Lime-green Alishams identity */
:root{--bg:#0c100b;--p:#151d13;--line:#34422d;--txt:#f4f7ef;--muted:#a3ad9a;--lime:#d9ff72;--violet:#d9ff72}
body{background:radial-gradient(ellipse at 10% 0%,#d9ff7214,transparent 36%),#0c100b;font-family:Estedad,Vazirmatn,Tahoma,sans-serif}
.brand{display:flex;align-items:center;gap:10px;font-size:15px}.brand img{width:42px;height:42px;padding:4px;object-fit:contain;border:1px solid #d9ff7255;border-radius:13px;background:#d9ff720b}
.stat,.panel,.card{background:linear-gradient(145deg,#192318,#111810);border-color:#34422d}
.btn,button{transition:transform .18s,border-color .18s,background .18s}.btn:hover,button:hover{border-color:#d9ff72;color:#e6ffb5;background:#d9ff720d}
.tab.active,.violet{background:#d9ff72!important;color:#17200f!important;border-color:#d9ff72!important;font-weight:800}
.search{background:#0d140c!important;border-color:#34422d!important;color:#f4f7ef!important}
.search:focus{border-color:#d9ff72!important;box-shadow:0 0 0 3px #d9ff7214}
.card{border-radius:18px}.stat{border-radius:18px}.stat strong{color:#d9ff72}
</style></head><body><div class="shell"><header class="top"><div class="brand"><img src="/assets/images/alishams-studio-logo.png" alt="Alishams"> Alishams <span>Community / مدیریت</span></div><a class="btn" href="/community-chat.html">بازگشت به انجمن ↗</a></header><section class="hero"><small>COMMUNITY CONTROL CENTER</small><h1>مرکز مدیریت انجمن</h1><p>مدیریت پیام‌ها، رسیدگی به گزارش‌ها و کنترل دسترسی اعضا.</p></section><div id="notice" class="notice"></div><section class="stats"><div class="stat"><small>پیام‌ها</small><strong id="smsg">—</strong></div><div class="stat"><small>گزارش‌های باز</small><strong id="srep">—</strong></div><div class="stat"><small>اعضای فعال</small><strong id="smem">—</strong></div><div class="stat"><small>محدودیت‌ها</small><strong id="sres">—</strong></div></section><nav class="tabs"><button class="tab active" data-tab="messages">پیام‌ها</button><button class="tab" data-tab="reports">گزارش‌ها</button><button class="tab" data-tab="members">اعضا و محدودیت‌ها</button></nav><section class="panel"><div class="toolbar"><input class="search" id="search" placeholder="جست‌وجو…"><button id="refresh">↻ بروزرسانی</button></div><div id="list" class="list"><div class="empty">در حال دریافت اطلاعات…</div></div></section></div><div id="modal" class="modal"><div class="box"><h3 id="mtitle">تأیید اقدام</h3><p id="mdesc" class="muted"></p><textarea id="reason" placeholder="دلیل (اختیاری)"></textarea><div class="boxfoot"><button id="cancel">انصراف</button><button id="accept" class="primary">تأیید</button></div></div></div>
<script>
(async()=>{
const URL="https://srfldjfrzmtnlabusssq.supabase.co",KEY="sb_publishable_UW2Wzzp8Y-KKd82nZHQUKA_RGl876RB",ADMIN="20e3df23-9f5a-4d88-8adc-093f75feb5df",sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fmt=s=>new Date(s).toLocaleString("fa-IR",{dateStyle:"medium",timeStyle:"short"}),fa=n=>Number(n||0).toLocaleString("fa-IR");
const {data:{session}}=await sb.auth.getSession();if(!session){location.href="/account.html";return}if(session.user.id!==ADMIN){document.body.innerHTML='<div style="padding:15vh 20px;text-align:center">دسترسی مجاز نیست · <a href="/community-chat.html">بازگشت</a></div>';return}
let tab="messages",data={messages:[],reports:[],restrictions:[],profiles:{}},pending=null;
function msg(t){$("notice").textContent=t;$("notice").classList.add("show");setTimeout(()=>$("notice").classList.remove("show"),5000)}
function ask(title,desc){$("mtitle").textContent=title;$("mdesc").textContent=desc;$("reason").value="";$("modal").classList.add("show");return new Promise(resolve=>pending=resolve)}
function done(v){$("modal").classList.remove("show");if(pending){pending(v);pending=null}}
$("cancel").onclick=()=>done(null);$("accept").onclick=()=>done($("reason").value.trim());$("modal").onclick=e=>{if(e.target===$("modal"))done(null)};
async function load(){
 $("list").innerHTML='<div class="empty">در حال دریافت…</div>';
 const [m,r,x,p]=await Promise.all([sb.from("community_messages").select("*").order("created_at",{ascending:false}).limit(120),sb.from("community_message_reports").select("*").order("created_at",{ascending:false}).limit(120),sb.from("community_user_restrictions").select("*").is("revoked_at",null).limit(200),sb.from("user_profiles").select("user_id,display_name,avatar_url").limit(500)]);
 for(const e of [m.error,r.error,x.error,p.error])if(e)msg(e.message);
 data.messages=m.data||[];data.reports=r.data||[];data.restrictions=x.data||[];data.profiles={};(p.data||[]).forEach(v=>data.profiles[v.user_id]=v);
 $("smsg").textContent=fa(data.messages.length);$("srep").textContent=fa(data.reports.filter(v=>v.status==="open").length);$("smem").textContent=fa(new Set(data.messages.map(v=>v.user_id)).size);$("sres").textContent=fa(data.restrictions.filter(v=>!v.expires_at||new Date(v.expires_at)>new Date()).length);render();
}
function who(id){const p=data.profiles[id]||{};return '<div><div class="who">'+esc(p.display_name||"عضو انجمن")+'</div><div class="meta">'+esc(id)+'</div></div>'}
function render(){
 const q=$("search").value.toLowerCase().trim();let out="";
 if(tab==="messages"){out=data.messages.filter(m=>(m.body||"").toLowerCase().includes(q)||(data.profiles[m.user_id]?.display_name||"").toLowerCase().includes(q)).map(m=>'<article class="card"><div class="cardtop">'+who(m.user_id)+'<span class="badge">'+(m.is_pinned?"سنجاق‌شده":m.message_type)+'</span></div><div class="bodytext">'+(m.deleted_at?'<i>پیام حذف شده</i>':esc(m.body||m.attachment_name||"پیوست"))+'</div><div class="meta">'+fmt(m.created_at)+'</div><div class="actions"><button class="violet" data-a="pin" data-id="'+m.id+'">'+(m.is_pinned?"برداشتن سنجاق":"سنجاق پیام")+'</button>'+(m.deleted_at?"":'<button class="red" data-a="delete" data-id="'+m.id+'">حذف پیام</button>')+(m.user_id!==ADMIN?'<button data-a="mute" data-user="'+m.user_id+'">محدودیت ۲۴ ساعته</button><button class="red" data-a="ban" data-user="'+m.user_id+'">مسدودسازی</button>':"")+'</div></article>').join("");
 }else if(tab==="reports"){out=data.reports.filter(r=>(r.reason||"").toLowerCase().includes(q)).map(r=>{const m=data.messages.find(v=>v.id===r.message_id);return '<article class="card"><div class="cardtop">'+who(r.reporter_id)+'<span class="badge">'+(r.status==="open"?"در انتظار بررسی":r.status==="reviewed"?"بررسی‌شده":"ردشده")+'</span></div><div class="bodytext">دلیل: '+esc(r.reason)+'</div><div class="meta">'+fmt(r.created_at)+'</div>'+(m?'<div class="bodytext">پیام: '+esc(m.body||m.attachment_name||"پیوست")+'</div>':"")+'<div class="actions">'+(r.status==="open"?'<button data-a="resolve" data-id="'+r.id+'">بررسی شد</button><button class="red" data-a="dismiss" data-id="'+r.id+'">رد گزارش</button>':"")+'</div></article>'}).join("");
 }else{const ids=[...new Set([...data.messages.map(m=>m.user_id),...data.restrictions.map(r=>r.user_id)])];out=ids.filter(id=>(data.profiles[id]?.display_name||"").toLowerCase().includes(q)||id.includes(q)).map(id=>{const active=data.restrictions.filter(r=>r.user_id===id&&(!r.expires_at||new Date(r.expires_at)>new Date()));return '<article class="card"><div class="cardtop">'+who(id)+'<span class="badge">'+(active.length?"دارای محدودیت":"عادی")+'</span></div><div class="actions">'+(id!==ADMIN?'<button data-a="mute" data-user="'+id+'">محدودیت ۲۴ ساعته</button><button class="red" data-a="ban" data-user="'+id+'">مسدودسازی</button>':"")+(active.length?'<button data-a="unrestrict" data-user="'+id+'">رفع محدودیت</button>':"")+'</div></article>'}).join("")}
 $("list").innerHTML=out||'<div class="empty">موردی برای نمایش وجود ندارد.</div>';
}
async function action(a,id,uid){
 if(a==="pin"){const m=data.messages.find(v=>v.id===id),patch=m.is_pinned?{is_pinned:false,pinned_at:null,pinned_by:null}:{is_pinned:true,pinned_at:new Date().toISOString(),pinned_by:session.user.id};const {error}=await sb.from("community_messages").update(patch).eq("id",id);if(error)msg(error.message)}
 if(a==="delete"){
  const reason=await ask("حذف دائمی پیام","این پیام و فایل پیوست آن برای همیشه از انجمن حذف می‌شود. برای تأیید ادامه دهید.");
  if(reason===null)return;
  const target=data.messages.find(m=>m.id===id);
  if(target?.attachment_path){
   const {error:storageError}=await sb.storage.from("community-chat").remove([target.attachment_path]);
   if(storageError){msg("حذف فایل پیوست انجام نشد: "+storageError.message);return}
  }
  const {error}=await sb.from("community_messages").delete().eq("id",id);
  if(error)msg("حذف پیام انجام نشد: "+error.message);
 }
 if(a==="mute"||a==="ban"){const reason=await ask(a==="mute"?"محدودیت ۲۴ ساعته":"مسدودسازی عضو","این عضو امکان ارسال پیام نخواهد داشت. دلیل را وارد کنید.");if(reason===null)return;const {error}=await sb.from("community_user_restrictions").insert({user_id:uid,restriction_type:a==="mute"?"mute":"ban",reason,expires_at:a==="mute"?new Date(Date.now()+86400000).toISOString():null,created_by:session.user.id});if(error)msg(error.message)}
 if(a==="unrestrict"){const {error}=await sb.from("community_user_restrictions").update({revoked_at:new Date().toISOString()}).eq("user_id",uid).is("revoked_at",null);if(error)msg(error.message)}
 if(a==="resolve"||a==="dismiss"){const {error}=await sb.from("community_message_reports").update({status:a==="resolve"?"reviewed":"dismissed",resolved_at:new Date().toISOString(),resolved_by:session.user.id}).eq("id",id);if(error)msg(error.message)}
 await load();
}
$("list").onclick=e=>{const b=e.target.closest("button[data-a]");if(b)action(b.dataset.a,b.dataset.id,b.dataset.user)};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});$("search").oninput=render;$("refresh").onclick=load;await load();
})();
</script></body></html>
