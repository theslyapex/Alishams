<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مدیریت عضویت خبرنامه | Alishams Studio</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#101116;--lime:#d9ff72;--muted:#a6a8b1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#d9ff7214,transparent 55%),var(--bg);color:#f5f5f5;font-family:Vazirmatn,Tahoma,sans-serif}.panel{width:min(100%,560px);padding:clamp(25px,6vw,48px);border:1px solid #d9ff7238;border-radius:26px;background:#17191f;text-align:center;box-shadow:0 25px 90px #0005}.mark{width:58px;height:58px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid #d9ff7255;border-radius:18px;color:var(--lime);font-size:28px}.eyebrow{color:var(--lime);font-size:11px;letter-spacing:2px}.panel h1{font-size:clamp(24px,6vw,34px);margin:12px 0}.panel p{color:var(--muted);font-size:14px;line-height:2}.status{min-height:1.5em;color:var(--lime)!important}.btn{display:inline-block;margin-top:12px;padding:11px 24px;border-radius:12px;background:transparent;color:var(--lime);text-decoration:none;font-weight:700;border:1px solid #d9ff7270;font:inherit;cursor:pointer;transition:background .2s,border-color .2s}.btn:hover{background:#d9ff7212;border-color:var(--lime)}.btn:disabled{opacity:.55;cursor:wait}body,.panel,.panel *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}img,svg,.mark{ -webkit-user-drag:none;user-drag:none}.home{display:block;margin-top:20px;color:#d5d6db;font-size:13px;text-decoration:none}
</style></head>
<body><main class="panel"><div class="mark">✦</div><span class="eyebrow">ALISHAMS STUDIO · NEWSLETTER</span><h1 id="title">مدیریت عضویت خبرنامه</h1><p id="description">در حال بررسی درخواستت هستیم…</p><p class="status" id="status" role="status" aria-live="polite"></p><button class="btn" id="actionButton" hidden></button><a class="home" href="/">بازگشت به سایت ↗</a></main>
<script>
const API='https://srfldjfrzmtnlabusssq.supabase.co/functions/v1/newsletter';const params=new URLSearchParams(location.search);const status=document.getElementById('status');const title=document.getElementById('title');const desc=document.getElementById('description');const btn=document.getElementById('actionButton');
async function call(action,token){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_UW2Wzzp8Y-KKd82nZHQUKA_RGl876RB'},body:JSON.stringify({action,token})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'درخواست انجام نشد.');return d}
(async()=>{const action=params.get('action');const token=params.get('token');try{if(action==='confirm'&&token){const d=await call('confirm',token);title.textContent='عضویتت تأیید شد!';desc.textContent='از این به بعد خبرنامه‌های Alishams Studio رو دریافت می‌کنی.';status.textContent=d.message;}else if(action==='unsubscribe'&&token){title.textContent='لغو عضویت خبرنامه';desc.textContent='اگر مطمئنی، دکمه زیر رو بزن تا ارسال خبرنامه به این ایمیل متوقف بشه.';btn.hidden=false;btn.textContent='لغو عضویت';btn.onclick=async()=>{btn.disabled=true;try{const d=await call('unsubscribe',token);title.textContent='عضویت لغو شد';desc.textContent='دیگه خبرنامه‌ای به این ایمیل ارسال نمی‌شه.';status.textContent=d.message;btn.hidden=true;}catch(e){status.textContent=e.message;btn.disabled=false;}};}else{title.textContent='لینک معتبر نیست';desc.textContent='لینک کامل داخل ایمیل رو باز کن یا دوباره از سایت درخواست بده.';}}catch(e){title.textContent='انجام نشد';desc.textContent='';status.textContent=e.message;}})();
document.addEventListener('selectstart',e=>e.preventDefault());document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&['a','c','x','s','u','p'].includes(k)){e.preventDefault();}});\n</script></body></html>
