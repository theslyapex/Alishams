<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت سفارش‌ها</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#07080b;--panel:rgba(19,22,31,.82);--panel2:#10131c;--line:rgba(255,255,255,.09);--lime:#d6ff59;--purple:#a78bfa;--muted:#a6adbd;--text:#f5f7fb}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;max-width:none;min-height:100vh;padding:28px clamp(14px,3vw,42px) 50px;color:var(--text);font:15px/1.9 "Estedad",Tahoma,sans-serif;background:radial-gradient(ellipse at 8% 0%,rgba(167,139,250,.14),transparent 34%),radial-gradient(ellipse at 95% 15%,rgba(214,255,89,.09),transparent 30%),#07080b}
main{max-width:1440px;margin:auto}a{color:var(--lime);text-decoration:none}a:hover{color:#fff}main>p:first-child{display:flex;align-items:center;justify-content:space-between;margin:0 0 22px;padding:12px 17px;border:1px solid var(--line);border-radius:16px;background:rgba(14,16,23,.7);font-size:12px;font-weight:800;letter-spacing:.12em}
h1,h2,h3,p{margin-top:0}h1{font-size:clamp(26px,3.2vw,42px);font-weight:900;letter-spacing:-.04em;line-height:1.35;margin-bottom:6px}h2{font-size:20px;font-weight:800;margin-bottom:16px}h3{font-size:15px;font-weight:800;margin:24px 0 10px}
section{background:linear-gradient(145deg,rgba(24,28,39,.94),rgba(13,15,22,.94));border:1px solid var(--line);border-radius:24px;padding:clamp(17px,2vw,27px);margin:16px 0;box-shadow:0 18px 55px #0003,inset 0 1px 0 #ffffff08;backdrop-filter:blur(18px)}
#login{max-width:520px;margin:9vh auto;padding:clamp(22px,4vw,38px);border-color:#a78bfa35}#login h2{font-size:26px}#login:before{content:"ALISHAMS / SECURE ACCESS";display:block;color:var(--lime);font-size:11px;letter-spacing:.16em;font-weight:800;margin-bottom:20px}
#app>h1{margin:28px 0 5px}#app>h1:before{content:"CONTROL CENTER";display:block;color:var(--lime);font-size:11px;letter-spacing:.18em;font-weight:800;margin-bottom:8px}#app>h1:after{content:"پنل اختصاصی مدیریت و پیگیری سفارش‌های استودیو";display:block;color:var(--muted);font-size:13px;font-weight:400;letter-spacing:0;margin-top:9px}
#app>section:first-of-type{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-color:#d6ff5926}#status{margin:0 0 0 auto;padding:7px 12px;border-radius:12px;background:#ffffff06;min-height:36px;display:flex;align-items:center}
.grid{display:grid;grid-template-columns:minmax(300px,.86fr) minmax(0,1.5fr);gap:18px;align-items:start}.grid>section{margin:0;min-width:0}.grid>section:first-child{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}.grid>section:first-child::-webkit-scrollbar{width:5px}.grid>section:first-child::-webkit-scrollbar-thumb{background:#ffffff20;border-radius:9px}
input,textarea,select,button{font:inherit;border-radius:13px;margin:6px 0;transition:border-color .18s,background .18s,transform .18s,box-shadow .18s}input,textarea,select{width:100%;padding:12px 14px;box-sizing:border-box;background:#090b11;color:var(--text);border:1px solid #ffffff17;outline:none}input:focus,textarea:focus,select:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #a78bfa18}textarea{min-height:110px;resize:vertical}label{display:block;color:#d5d9e3;font-size:13px;font-weight:700;margin:15px 0 4px}button{padding:11px 17px;background:var(--lime);color:#11150a;border:1px solid transparent;cursor:pointer;font-weight:800;font-size:13px;box-shadow:0 5px 18px #d6ff5910}button:hover{transform:translateY(-1px);box-shadow:0 8px 24px #d6ff5922}button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}#logout{background:#ffffff08;color:#e9ecf4;border-color:var(--line)}#refresh{background:var(--lime);color:#11150a}#save{margin-top:18px}#convert{background:#a78bfa;color:#100b1e}#del{background:#ff657a16;color:#ff8b9b;border-color:#ff657a30;box-shadow:none}
.hidden{display:none!important}.muted{color:var(--muted);white-space:pre-wrap;font-size:13px;line-height:1.9}.order{display:block;width:100%;text-align:right;background:linear-gradient(110deg,#ffffff06,#ffffff02);color:var(--text);border:1px solid var(--line);padding:13px 15px;margin:8px 0;border-radius:15px;font-weight:600;line-height:1.9;box-shadow:none}.order:hover{border-color:#d6ff5960;background:#d6ff5908}.order:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#serviceCounts p{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:7px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#ffffff04;color:#e4e8f1}#serviceCounts p:after{content:"سفارش";font-size:11px;color:var(--lime);background:#d6ff5910;padding:2px 8px;border-radius:8px}
#title{overflow-wrap:anywhere}#meta{padding:10px 12px;border-radius:12px;background:#ffffff05;border:1px solid var(--line);overflow-wrap:anywhere}#description{padding:15px;border-radius:15px;background:#090b11;border:1px solid var(--line);color:#d2d7e2}
#result{padding:12px;border-radius:12px;background:#a78bfa0c;border:1px solid #a78bfa24;overflow-wrap:anywhere}
@media(max-width:850px){body{padding:15px 12px 35px}.grid{grid-template-columns:1fr}.grid>section:first-child{position:static;max-height:none;overflow:visible}#app>section:first-of-type{align-items:stretch}#status{width:100%;margin:4px 0 0}}@media(max-width:480px){main>p:first-child{border-radius:12px}section{border-radius:18px;padding:16px}h1{font-size:27px}h2{font-size:18px}button{padding:10px 13px}}
</style><main><p><a href="/">ALISHAMS STUDIO ↖</a></p><section id="login"><h2>ورود مدیر</h2><p>پیوند ورود به ایمیل مدیر ارسال می‌شود.</p><form id="lf"><input id="email" type="email" value="theslyapex@gmail.com" required><button>ارسال پیوند ورود</button></form><p id="notice"></p></section><div id="app" class="hidden"><h1>مرکز فرمان سفارش‌ها</h1><section><button id="refresh">به‌روزرسانی</button> <button id="logout">خروج</button><p id="status" class="muted"></p></section><div class="grid"><section><h2>سفارش‌ها</h2><input id="search" placeholder="جست‌وجو"><select id="filter"><option value="all">همه</option><option value="new">ثبت‌شده</option><option value="reviewing">در حال بررسی</option><option value="awaiting_customer">در انتظار تأیید</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option><option value="converted">تبدیل‌شده</option></select><div id="orders"></div><h3>شمارش سفارش‌ها به تفکیک خدمت</h3><div id="serviceCounts" class="muted"></div></section><section><h2 id="title">سفارشی انتخاب نشده</h2><p id="meta" class="muted"></p><div id="detail" class="hidden"><p id="description" class="muted"></p><label>وضعیت<select id="st"><option value="new">ثبت‌شده</option><option value="reviewing">در حال بررسی</option><option value="awaiting_customer">در انتظار تأیید مشتری</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option><option value="converted">تبدیل‌شده به پروژه</option></select></label><label>قیمت نهایی پیشنهادی<input id="price" type="number" min="0"></label><label>تاریخ تحویل<input id="eta" type="date"></label><label>پیام برای مشتری<textarea id="msg" maxlength="3000"></textarea></label><label>یادداشت داخلی<textarea id="notes" maxlength="8000"></textarea></label><button id="save">ذخیره تغییرات</button> <button id="convert">تبدیل به پروژه</button> <button id="del">حذف سفارش</button><p id="result" class="muted"></p></div></section></div></div></main><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const sb=createClient("https://srfldjfrzmtnlabusssq.supabase.co","sb_publishable_UW2Wzzp8Y-KKd82nZHQUKA_RGl876RB"),API="https://srfldjfrzmtnlabusssq.supabase.co/functions/v1/order-admin",OWNER="theslyapex@gmail.com",$=x=>document.getElementById(x),labels={new:"ثبت‌شده",reviewing:"در حال بررسی",awaiting_customer:"در انتظار تأیید",approved:"تأییدشده",rejected:"ردشده",converted:"تبدیل‌شده"};let session,orders=[],chosen;const say=(id,s)=>$(id).textContent=s;async function call(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":"sb_publishable_UW2Wzzp8Y-KKd82nZHQUKA_RGl876RB","Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"عملیات ناموفق بود");return d}async function show(){const r=await sb.auth.getSession();session=r.data.session;if(session&&session.user.email?.toLowerCase()===OWNER){$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}else{$("login").classList.remove("hidden");$("app").classList.add("hidden");if(session)await sb.auth.signOut()}}$("lf").onsubmit=async e=>{e.preventDefault();if($("email").value.trim().toLowerCase()!==OWNER)return say("notice","فقط مدیر مجاز است.");const r=await sb.auth.signInWithOtp({email:OWNER,options:{emailRedirectTo:location.href.split("#")[0]}});say("notice",r.error?.message||"پیوند ورود ارسال شد.")};sb.auth.onAuthStateChange(()=>setTimeout(show,0));$("logout").onclick=async()=>{await sb.auth.signOut();show()};$("refresh").onclick=load;$("search").oninput=render;$("filter").onchange=render;async function load(){try{const d=await call({action:"list"});orders=d.orders||[];render();say("status","تعداد سفارش‌ها: "+orders.length);if(chosen){const fresh=orders.find(x=>x.id===chosen.id);if(fresh)select(fresh)}}catch(e){say("status",e.message)}}function renderServiceCounts(){const root=$("serviceCounts");root.replaceChildren();const counts={};orders.forEach(o=>{const key=o.service||"نامشخص";counts[key]=(counts[key]||0)+1});const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);if(!sorted.length){root.textContent="هنوز سفارشی ثبت نشده است.";return}sorted.forEach(([name,count])=>{const row=document.createElement("p");row.textContent=name+" : "+count+" سفارش";root.append(row)})}function render(){renderServiceCounts();const root=$("orders");root.replaceChildren();const q=$("search").value.toLowerCase(),f=$("filter").value;orders.filter(o=>(f==="all"||o.status===f)&&[o.client_name,o.title,o.service,o.tracking_code,o.contact_info].some(x=>String(x||"").toLowerCase().includes(q))).forEach(o=>{const b=document.createElement("button");b.className="order";b.textContent=o.title+" · "+o.client_name+" · "+(labels[o.status]||o.status)+" · "+o.tracking_code;b.onclick=()=>select(o);root.append(b)});if(!root.children.length)root.textContent="سفارشی پیدا نشد."}function select(o){chosen=o;$("detail").classList.remove("hidden");$("title").textContent=o.title;say("meta",o.client_name+" · "+o.contact_info+" · "+o.tracking_code);say("description","خدمت: "+o.service+"\nبودجه: "+o.budget+"\n\n"+o.details);$("st").value=o.status;$("price").value=o.quoted_price||0;$("eta").value=o.eta_date||"";$("msg").value=o.public_message||"";$("notes").value=o.internal_notes||"";$("convert").disabled=!!o.project_id||!["approved","awaiting_customer"].includes(o.status);$("del").disabled=!!o.project_id;render()}$("save").onclick=async()=>{if(!chosen)return;try{await call({action:"update",id:chosen.id,status:$("st").value,quoted_price:Number($("price").value||0),eta_date:$("eta").value,public_message:$("msg").value,internal_notes:$("notes").value});say("status","ذخیره شد.");await load()}catch(e){say("status",e.message)}};$("convert").onclick=async()=>{if(!chosen||!confirm("به پروژه تبدیل شود؟"))return;try{const d=await call({action:"convert",id:chosen.id});say("result","کد پروژه: "+d.project.tracking_code+"\nکلید خصوصی: "+d.access_key+"\nلینک: "+location.origin+"/project-tracking.html\nکلید را همین حالا برای مشتری ارسال کن.");await load()}catch(e){say("status",e.message)}};$("del").onclick=async()=>{if(!chosen||!confirm("سفارش حذف شود؟"))return;try{await call({action:"delete",id:chosen.id});chosen=null;$("detail").classList.add("hidden");await load()}catch(e){say("status",e.message)}};show();</script></html>
