<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت سفارش‌ها</title><meta name="robots" content="noindex,nofollow"><style>body{background:#080908;color:#f4f4ee;font:15px Tahoma;max-width:1100px;margin:30px auto;padding:15px}section{background:#151710;border:1px solid #d6ff5933;border-radius:18px;padding:20px;margin:15px 0}input,textarea,select,button{font:inherit;padding:10px;border-radius:10px;margin:6px 0}input,textarea,select{width:100%;box-sizing:border-box;background:#090a08;color:white;border:1px solid #ffffff30}button{background:#d6ff59;border:0;cursor:pointer;font-weight:bold}.hidden{display:none}a{color:#d6ff59}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:15px}.order{display:block;width:100%;text-align:right;background:#090a08;color:white;border:1px solid #ffffff20;padding:12px;margin:6px 0;border-radius:12px}.muted{color:#aaa;white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><main><p><a href="/">ALISHAMS STUDIO ↖</a></p><section id="login"><h2>ورود مدیر</h2><p>پیوند ورود به ایمیل مدیر ارسال می‌شود.</p><form id="lf"><input id="email" type="email" value="theslyapex@gmail.com" required><button>ارسال پیوند ورود</button></form><p id="notice"></p></section><div id="app" class="hidden"><h1>مدیریت سفارش‌ها</h1><section><button id="refresh">به‌روزرسانی</button> <button id="logout">خروج</button><p id="status" class="muted"></p></section><div class="grid"><section><h2>سفارش‌ها</h2><input id="search" placeholder="جست‌وجو"><select id="filter"><option value="all">همه</option><option value="new">ثبت‌شده</option><option value="reviewing">در حال بررسی</option><option value="awaiting_customer">در انتظار تأیید</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option><option value="converted">تبدیل‌شده</option></select><div id="orders"></div><h3>شمارش سفارش‌ها به تفکیک خدمت</h3><div id="serviceCounts" class="muted"></div></section><section><h2 id="title">سفارشی انتخاب نشده</h2><p id="meta" class="muted"></p><div id="detail" class="hidden"><p id="description" class="muted"></p><label>وضعیت<select id="st"><option value="new">ثبت‌شده</option><option value="reviewing">در حال بررسی</option><option value="awaiting_customer">در انتظار تأیید مشتری</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option><option value="converted">تبدیل‌شده به پروژه</option></select></label><label>قیمت نهایی پیشنهادی<input id="price" type="number" min="0"></label><label>تاریخ تحویل<input id="eta" type="date"></label><label>پیام برای مشتری<textarea id="msg" maxlength="3000"></textarea></label><label>یادداشت داخلی<textarea id="notes" maxlength="8000"></textarea></label><button id="save">ذخیره تغییرات</button> <button id="convert">تبدیل به پروژه</button> <button id="del">حذف سفارش</button><p id="result" class="muted"></p></div></section></div></div></main><script type="module">import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const sb=createClient("https://srfldjfrzmtnlabusssq.supabase.co","sb_publishable_UW2Wzzp8Y-KKd82nZHQUKA_RGl876RB"),API="https://srfldjfrzmtnlabusssq.supabase.co/functions/v1/order-admin",OWNER="theslyapex@gmail.com",$=x=>document.getElementById(x),labels={new:"ثبت‌شده",reviewing:"در حال بررسی",awaiting_customer:"در انتظار تأیید",approved:"تأییدشده",rejected:"ردشده",converted:"تبدیل‌شده"};let session,orders=[],chosen;const say=(id,s)=>$(id).textContent=s;async function call(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":"sb_publishable_UW2Wzzp8Y-KKd82nZHQUKA_RGl876RB","Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"عملیات ناموفق بود");return d}async function show(){const r=await sb.auth.getSession();session=r.data.session;if(session&&session.user.email?.toLowerCase()===OWNER){$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}else{$("login").classList.remove("hidden");$("app").classList.add("hidden");if(session)await sb.auth.signOut()}}$("lf").onsubmit=async e=>{e.preventDefault();if($("email").value.trim().toLowerCase()!==OWNER)return say("notice","فقط مدیر مجاز است.");const r=await sb.auth.signInWithOtp({email:OWNER,options:{emailRedirectTo:location.href.split("#")[0]}});say("notice",r.error?.message||"پیوند ورود ارسال شد.")};sb.auth.onAuthStateChange(()=>setTimeout(show,0));$("logout").onclick=async()=>{await sb.auth.signOut();show()};$("refresh").onclick=load;$("search").oninput=render;$("filter").onchange=render;async function load(){try{const d=await call({action:"list"});orders=d.orders||[];render();say("status","تعداد سفارش‌ها: "+orders.length);if(chosen){const fresh=orders.find(x=>x.id===chosen.id);if(fresh)select(fresh)}}catch(e){say("status",e.message)}}function renderServiceCounts(){const root=$("serviceCounts");root.replaceChildren();const counts={};orders.forEach(o=>{const key=o.service||"نامشخص";counts[key]=(counts[key]||0)+1});const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);if(!sorted.length){root.textContent="هنوز سفارشی ثبت نشده است.";return}sorted.forEach(([name,count])=>{const row=document.createElement("p");row.textContent=name+" : "+count+" سفارش";root.append(row)})}function render(){renderServiceCounts();const root=$("orders");root.replaceChildren();const q=$("search").value.toLowerCase(),f=$("filter").value;orders.filter(o=>(f==="all"||o.status===f)&&[o.client_name,o.title,o.service,o.tracking_code,o.contact_info].some(x=>String(x||"").toLowerCase().includes(q))).forEach(o=>{const b=document.createElement("button");b.className="order";b.textContent=o.title+" · "+o.client_name+" · "+(labels[o.status]||o.status)+" · "+o.tracking_code;b.onclick=()=>select(o);root.append(b)});if(!root.children.length)root.textContent="سفارشی پیدا نشد."}function select(o){chosen=o;$("detail").classList.remove("hidden");$("title").textContent=o.title;say("meta",o.client_name+" · "+o.contact_info+" · "+o.tracking_code);say("description","خدمت: "+o.service+"\nبودجه: "+o.budget+"\n\n"+o.details);$("st").value=o.status;$("price").value=o.quoted_price||0;$("eta").value=o.eta_date||"";$("msg").value=o.public_message||"";$("notes").value=o.internal_notes||"";$("convert").disabled=!!o.project_id||!["approved","awaiting_customer"].includes(o.status);$("del").disabled=!!o.project_id;render()}$("save").onclick=async()=>{if(!chosen)return;try{await call({action:"update",id:chosen.id,status:$("st").value,quoted_price:Number($("price").value||0),eta_date:$("eta").value,public_message:$("msg").value,internal_notes:$("notes").value});say("status","ذخیره شد.");await load()}catch(e){say("status",e.message)}};$("convert").onclick=async()=>{if(!chosen||!confirm("به پروژه تبدیل شود؟"))return;try{const d=await call({action:"convert",id:chosen.id});say("result","کد پروژه: "+d.project.tracking_code+"\nکلید خصوصی: "+d.access_key+"\nلینک: "+location.origin+"/project-tracking.html\nکلید را همین حالا برای مشتری ارسال کن.");await load()}catch(e){say("status",e.message)}};$("del").onclick=async()=>{if(!chosen||!confirm("سفارش حذف شود؟"))return;try{await call({action:"delete",id:chosen.id});chosen=null;$("detail").classList.add("hidden");await load()}catch(e){say("status",e.message)}};show();</script></html>
