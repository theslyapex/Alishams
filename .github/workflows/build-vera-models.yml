name: Build VERA GLB architectural models

on:
  push:
    branches: [main]
    paths:
      - "tools/generate_vera_glb.py"
      - ".github/workflows/build-vera-models.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-model-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Generate GLB models
        run: python3 tools/generate_vera_glb.py
      - name: Commit generated model assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vera/*.glb
          if git diff --cached --quiet; then
            echo "GLB assets are already up to date."
            exit 0
          fi
          git commit -m "Add detailed VERA GLB architectural models"
          git push origin HEAD:main
