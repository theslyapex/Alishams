name: Publish Hardware Shenas APK

on:
  push:
    branches: [main]
    paths:
      - "case-studies/hardware-shenas.html"
      - ".github/workflows/publish-hardware-shenas-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Hardware Shenas source
        uses: actions/checkout@v4
        with:
          repository: theslyapex/sakhtafzar-shenas
          ref: main
          path: hardware-shenas-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Android APK
        working-directory: hardware-shenas-source
        run: gradle assembleDebug

      - name: Copy APK into website
        run: |
          mkdir -p downloads
          cp hardware-shenas-source/app/build/outputs/apk/debug/*.apk downloads/hardware-shenas.apk
          test -s downloads/hardware-shenas.apk
          ls -lh downloads/hardware-shenas.apk

      - name: Publish APK to website repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/hardware-shenas.apk
          if git diff --cached --quiet; then
            echo "APK is already up to date."
            exit 0
          fi
          git commit -m "Publish latest Hardware Shenas APK"
          git push
