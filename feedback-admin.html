<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090a0d"><title>مرکز بازخورد مشتریان | Alishams</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090a0d;--panel:#14161d;--line:#ffffff18;--text:#f5f6fa;--muted:#a0a4b2;--lime:#d9ff72;--purple:#a58bff;--red:#ff9292}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#a58bff18,transparent 35%),var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:26px auto}.head,.card{border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#191b24,#101117);padding:clamp(15px,3vw,23px);margin-bottom:14px}.head{border-color:#d9ff7240}.head h1{font-size:clamp(22px,4vw,31px);margin:0 0 5px}.muted{color:var(--muted);font-size:12px;line-height:2}.notice{font-size:12px;color:var(--purple);line-height:2}.notice.error{color:var(--red)}.notice.success{color:var(--lime)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.stat{border:1px solid var(--line);border-radius:14px;padding:13px;background:#ffffff05}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;color:var(--lime);font-size:24px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:13px 0}.toolbar input,.toolbar select,.field textarea,.field select{min-width:0;padding:10px 12px;border:1px solid #ffffff20;border-radius:11px;background:#0b0c12;color:#fff;font:12px Vazirmatn}.toolbar input{flex:1 1 230px}.btn{border:1px solid #ffffff20;border-radius:10px;padding:9px 13px;background:#ffffff09;color:#fff;font:700 12px Vazirmatn;cursor:pointer}.btn.primary{background:var(--lime);color:#10120b;border-color:var(--lime)}.btn:disabled{opacity:.5;cursor:wait}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:15px;padding:15px;background:#ffffff04}.item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}.item h3{margin:0;font-size:14px}.stars{color:var(--lime);letter-spacing:2px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0;color:var(--muted);font-size:11px}.chip{border:1px solid #a58bff40;background:#a58bff10;color:#c8b7ff;border-radius:8px;padding:3px 8px}.message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:2;font-size:13px;margin:10px 0}.field{display:grid;gap:6px;margin-top:10px}.field label{font-size:11px;color:var(--muted)}.field textarea{width:100%;min-height:65px;resize:vertical}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.actions select{padding:8px;border:1px solid #ffffff20;border-radius:9px;background:#0b0c12;color:#fff;font:11px Vazirmatn}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.item{padding:12px}}
</style></head><body><main class="wrap">
<header class="head"><h1>مرکز بازخورد مشتریان</h1><p class="muted">مدیریت امتیازها، پیشنهادها، نظرها و گزارش مشکلات ثبت‌شده در سایت.</p><div id="status" class="notice">در حال بررسی دسترسی مدیر…</div></header>
<div id="app" class="hidden"><section class="stats"><div class="stat"><span>کل بازخوردها</span><strong id="total">—</strong></div><div class="stat"><span>میانگین امتیاز</span><strong id="average">—</strong></div><div class="stat"><span>جدید</span><strong id="newCount">—</strong></div><div class="stat"><span>رسیدگی‌شده</span><strong id="resolved">—</strong></div></section>
<section class="card"><div class="toolbar"><input id="search" type="search" placeholder="جست‌وجو در متن، نام یا ایمیل…"><select id="filter"><option value="all">همه وضعیت‌ها</option><option value="new">جدید</option><option value="reviewing">در حال بررسی</option><option value="resolved">رسیدگی‌شده</option><option value="archived">بایگانی‌شده</option></select><button id="refresh" class="btn">بروزرسانی ↻</button></div><div id="list" class="list"><p class="empty">در حال دریافت بازخوردها…</p></div></section></div>
</main><script>
(()=>{const URL="https://srfldjfrzmtnlabusssq.supabase.co",KEY="sb_publishable_UW2Wzzp8Y-KKd82nZHQUKA_RGl876RB";const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),date=s=>new Date(s).toLocaleString("fa-IR");let rows=[];
function status(m,t=""){$("status").textContent=m;$("status").className="notice "+t}
async function api(body){const {data,error}=await sb.auth.getSession();if(error||!data.session)throw Error("ابتدا با حساب مدیر وارد شو.");const r=await fetch(URL+"/functions/v1/site-feedback-admin",{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+data.session.access_token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"درخواست انجام نشد.");return d}
function render(){const q=$("search").value.trim().toLowerCase(),f=$("filter").value;const list=rows.filter(x=>(f==="all"||x.status===f)&&[x.message,x.display_name,x.email,x.category].some(v=>String(v||"").toLowerCase().includes(q)));$("list").innerHTML=list.length?list.map(x=>'<article class="item" data-id="'+esc(x.id)+'"><div class="item-top"><div><h3>'+esc(({general:"نظر کلی",service:"خدمات",website:"طراحی و عملکرد سایت",idea:"پیشنهاد جدید",problem:"گزارش مشکل"})[x.category]||x.category)+'</h3><div class="meta"><span>'+esc(x.display_name||"کاربر مهمان")+'</span>'+(x.email?'<span>· '+esc(x.email)+'</span>':"")+'<span>· '+date(x.created_at)+'</span></div></div><div class="stars">'+("★".repeat(x.rating))+('<span style="color:#626570">'+("★".repeat(5-x.rating))+'</span>')+'</div></div><p class="message">'+esc(x.message)+'</p><div class="meta"><span class="chip">امتیاز '+x.rating+'/۵</span><span class="chip">'+esc(x.page_url||"صفحه نامشخص")+'</span></div><div class="field"><label>یادداشت داخلی مدیر</label><textarea class="note" maxlength="2000" placeholder="یادداشت برای پیگیری داخلی…">'+esc(x.admin_note||"")+'</textarea></div><div class="actions"><select class="state"><option value="new">جدید</option><option value="reviewing">در حال بررسی</option><option value="resolved">رسیدگی‌شده</option><option value="archived">بایگانی‌شده</option></select><button class="btn primary save">ذخیره تغییرات</button><button class="btn delete">حذف</button></div></article>').join(""):'<p class="empty">بازخوردی با این فیلتر پیدا نشد.</p>';
document.querySelectorAll(".item").forEach(el=>{const x=rows.find(x=>x.id===el.dataset.id);el.querySelector(".state").value=x.status})}
async function load(){const d=await api({action:"list"});rows=d.rows||[];$("total").textContent=d.stats.total;$("average").textContent=d.stats.average+" / ۵";$("newCount").textContent=d.stats.new;$("resolved").textContent=d.stats.resolved;render();$("app").classList.remove("hidden");status("اتصال امن برقرار است.","success")}
$("refresh").addEventListener("click",()=>load().catch(e=>status(e.message,"error")));$("search").addEventListener("input",render);$("filter").addEventListener("change",render);
$("list").addEventListener("click",async e=>{const card=e.target.closest(".item");if(!card)return;const x=rows.find(x=>x.id===card.dataset.id);if(e.target.closest(".save")){const b=e.target.closest(".save");b.disabled=true;try{await api({action:"update",id:x.id,status:card.querySelector(".state").value,admin_note:card.querySelector(".note").value});await load();status("تغییرات ذخیره شد.","success")}catch(err){status(err.message,"error")}finally{b.disabled=false}}if(e.target.closest(".delete")){if(!confirm("این بازخورد برای همیشه حذف شود؟"))return;try{await api({action:"delete",id:x.id});await load();status("بازخورد حذف شد.","success")}catch(err){status(err.message,"error")}}});
load().catch(e=>status(e.message,"error"));
})();
</script></body></html>
