<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d"><meta name="robots" content="noindex,nofollow">
<title>504 · پاسخ سرور بیش از حد طول کشید | Alishams</title>
<style>
:root{color-scheme:dark;--bg:#090a0d;--panel:#12151b;--ink:#f5f3ee;--muted:#a5a8b2;--line:#ffffff18;--accent:#d9ff72;--violet:#b6a0ff;--coral:#ff927a}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;overflow-x:hidden;padding:28px;background:radial-gradient(ellipse at 15% 15%,#b6a0ff17,transparent 35%),radial-gradient(ellipse at 85% 80%,#d9ff7210,transparent 35%),#090a0d}
.shell{width:min(100%,960px);display:grid;grid-template-columns:1fr 330px;gap:48px;align-items:center}
.brand{font:800 11px/1.5 Arial,sans-serif;letter-spacing:2px;color:var(--accent);direction:ltr;text-align:right}
.pill{display:inline-flex;align-items:center;gap:9px;margin-top:26px;padding:7px 12px;border:1px solid var(--line);border-radius:30px;color:#c4c5cc;font-size:11px}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 14px var(--coral)}
h1{margin:18px 0 12px;font-size:clamp(26px,4vw,42px);line-height:1.7;font-weight:800}
p{max-width:560px;margin:0;color:var(--muted);font-size:14px;line-height:2.3}
.help{margin-top:12px;font-size:12px;color:#858994}
.actions{display:flex;flex-wrap:wrap;gap:11px;margin-top:27px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 18px;border-radius:13px;border:1px solid var(--line);background:#ffffff08;color:var(--ink);font-size:12px;font-weight:700;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-2px);border-color:#d9ff7280}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#12150a}
.art{position:relative;display:grid;place-items:center;min-height:320px}
.art:before,.art:after{content:"";position:absolute;width:245px;height:245px;border:1px solid #d9ff7226;border-radius:50%;box-shadow:0 0 0 32px #d9ff7208,0 0 0 64px #b6a0ff08}
.art:after{width:310px;height:115px;border-color:#b6a0ff40;transform:rotate(-32deg);box-shadow:none}
.card{position:relative;width:100%;padding:16px;border:1px solid #ffffff20;border-radius:23px;background:linear-gradient(145deg,#191c24f2,#101116f2);box-shadow:0 30px 80px #0009;transform:rotate(-3deg)}
.top,.bottom{display:flex;align-items:center;justify-content:space-between;direction:ltr;color:#858994;font:10px Arial,sans-serif;letter-spacing:1px}
.top{padding-bottom:13px;border-bottom:1px solid var(--line)}.bottom{padding-top:13px;border-top:1px solid var(--line)}
.lights{display:flex;gap:6px}.lights i{width:7px;height:7px;border-radius:50%;background:#5a5e68}.lights i:first-child{background:var(--coral)}.lights i:nth-child(2){background:#e5c875}.lights i:nth-child(3){background:var(--accent)}
.big{height:210px;display:grid;place-items:center;font:900 clamp(70px,11vw,104px)/1 Arial,sans-serif;letter-spacing:-7px;color:#f2f0e9;text-shadow:0 12px 35px #000}
.big span:first-child{color:var(--accent)}.big span:last-child{color:var(--violet)}
.bottom strong{color:var(--accent);font-weight:700}
footer{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#6f737e;font-size:10px}
footer a{color:#aeb1bb;text-decoration:none}
@media(max-width:720px){body{padding:25px 20px 58px}.shell{grid-template-columns:1fr;gap:4px}.art{grid-row:1;min-height:240px}.card{width:min(88%,310px)}.big{height:150px}.art:before{width:190px;height:190px}.art:after{width:250px;height:90px}.content{text-align:center}.brand{text-align:center}.pill{margin-top:15px}.actions{justify-content:center}.help{margin-inline:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="shell">
<section class="content">
<div class="brand">ALISHAMS DIGITAL STUDIO</div>
<div class="pill">پایان مهلت انتظار</div>
<h1>پاسخ سرور بیش از حد طول کشید</h1>
<p>زمان انتظار برای دریافت پاسخ به پایان رسید.</p><p class="help">اتصال ممکن است موقتاً کند یا ناپایدار باشد. دوباره تلاش کن.</p>
<div class="actions"><a class="btn primary" href="javascript:location.reload()">تلاش دوباره</a><a class="btn" href="/">صفحه اصلی</a></div>
</section>
<div class="art" aria-hidden="true"><div class="card"><div class="top"><span>ALISHAMS / SYSTEM</span><span class="lights"><i></i><i></i><i></i></span></div><div class="big"><span>5</span><span>04</span></div><div class="bottom"><span>REQUEST STATUS</span><strong>HTTP 504</strong></div></div></div>
</main>
<footer>© 2026 علی شمس · <a href="/">alishams.ir</a></footer>
<script>
(function(){const stop=e=>e.preventDefault();['contextmenu','copy','cut','selectstart','dragstart'].forEach(t=>document.addEventListener(t,stop,true));document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['a','c','x'].includes(e.key.toLowerCase()))e.preventDefault()},true)})();
</script>
</body></html>
