<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090b0d">
<title>مدیریت بازی بلدی؟ | Alishams Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090c10;--panel:#121820;--panel2:#18222b;--line:#ffffff16;--gold:#e9c875;--teal:#55c6b5;--muted:#9aa8b5;--text:#f3f5f6;--red:#ff827d;--green:#80d7a2}
*{box-sizing:border-box}body{margin:0;padding:22px;background:radial-gradient(ellipse at 8% 0%,#55c6b515,transparent 34%),var(--bg);color:var(--text);font:13px/1.9 Vazirmatn,Tahoma,sans-serif}button,input,textarea{font:inherit}.wrap{max-width:1500px;margin:auto}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{font-size:22px;color:var(--gold);margin:0}.muted{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:11px;padding:9px 14px;background:#ffffff09;color:var(--text);cursor:pointer}.btn.primary{background:linear-gradient(110deg,#d8b66c,#f1d99d);color:#172019;border:0;font-weight:800}.btn.danger{border-color:#ff827d55;color:#ffaaa5}.btn:disabled{opacity:.5;cursor:wait}.card{background:linear-gradient(145deg,#ffffff09,#ffffff03);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:13px;background:#ffffff05}.stat b{display:block;font-size:23px;color:var(--gold)}.stat span{font-size:11px;color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}.toolbar input,.toolbar select,.field input,.field textarea{border:1px solid var(--line);border-radius:10px;background:#0b1117;color:var(--text);padding:10px;min-width:0}.toolbar input{flex:1;min-width:170px}.list{display:grid;gap:9px}.request{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:13px;background:#ffffff04;text-align:right;color:inherit;width:100%;cursor:pointer}.request.selected{border-color:#55c6b577;background:#55c6b50c}.request b{display:block}.request small{color:var(--muted)}.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:10px;background:#ffffff10;color:var(--muted)}.pill.pending{background:#e9c87518;color:var(--gold)}.pill.approved{background:#80d7a218;color:var(--green)}.pill.rejected{background:#ff827d18;color:var(--red)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{min-width:0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field div,.field textarea{width:100%;overflow-wrap:anywhere}.field textarea{min-height:80px;resize:vertical}.receipt{display:inline-flex;margin-top:12px;color:var(--teal);text-decoration:underline}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.notice{padding:10px;border-radius:11px;background:#e9c8750d;border:1px solid #e9c87533;color:#ead9b2;margin-top:10px}.status{margin:10px 0;color:var(--muted);min-height:24px}.login{max-width:440px;margin:8vh auto}.login input{width:100%;margin:10px 0}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:760px){body{padding:12px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr 1fr}.detail-grid{grid-template-columns:1fr}.request{grid-template-columns:1fr}.stat b{font-size:19px}}@media(max-width:420px){.stats{grid-template-columns:1fr}.top h1{font-size:19px}}
</style>
</head>
<body><main class="wrap">
<section id="login" class="card login"><h2>ورود مدیر</h2><p class="muted">برای مشاهده و بررسی درخواست‌های خرید سکه، پیوند ورود به ایمیل مدیر ارسال می‌شود.</p><form id="loginForm"><input id="email" type="email" value="theslyapex@gmail.com" required autocomplete="email"><button class="btn primary" type="submit">ارسال پیوند ورود</button></form><p id="loginStatus" class="status"></p></section>
<section id="app" class="hidden">
<header class="top"><div><h1>بازی «بلدی؟»</h1><div class="muted">مدیریت درخواست خرید و شارژ سکه بازیکنان</div></div><div class="actions"><button class="btn" id="refresh">به‌روزرسانی</button><button class="btn" id="logout">خروج مدیر</button></div></header>
<div class="stats"><div class="stat"><b id="pendingCount">۰</b><span>در انتظار بررسی</span></div><div class="stat"><b id="approvedCount">۰</b><span>تأیید و شارژ شده</span></div><div class="stat"><b id="rejectedCount">۰</b><span>ردشده</span></div></div>
<p id="status" class="status" role="status"></p>
<div class="detail-grid">
<section class="card"><h3>درخواست‌ها</h3><div class="toolbar"><input id="search" placeholder="جست‌وجو با نام، ایمیل یا کد پیگیری"><select id="filter"><option value="all">همه درخواست‌ها</option><option value="pending">در انتظار بررسی</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option></select></div><div id="requests" class="list"><div class="empty">در حال بارگذاری…</div></div></section>
<section class="card"><h3 id="detailTitle">جزئیات درخواست</h3><div id="detail" class="empty">برای مشاهده اطلاعات، یک درخواست را انتخاب کن.</div></section>
</div></section>
</main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const URL="https://srfldjfrzmtnlabusssq.supabase.co",KEY="sb_publishable_UW2Wzzp8Y-KKd82nZHQUKA_RGl876RB",OWNER="theslyapex@gmail.com",API=URL+"/functions/v1/baladi-coin-admin";
const sb=createClient(URL,KEY),$=id=>document.getElementById(id),fa=n=>new Intl.NumberFormat("fa-IR").format(Number(n)||0);
let session=null,rows=[],chosen=null;
const say=(id,msg)=>$(id).textContent=msg;
async function show(){const {data}=await sb.auth.getSession();session=data.session;if(session&&session.user.email?.toLowerCase()===OWNER){$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()}else{$("login").classList.remove("hidden");$("app").classList.add("hidden");if(session)await sb.auth.signOut()}}
async function api(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||"عملیات انجام نشد.");return d}
$("loginForm").onsubmit=async e=>{e.preventDefault();if($("email").value.trim().toLowerCase()!==OWNER)return say("loginStatus","فقط مدیر اصلی مجاز است.");const {error}=await sb.auth.signInWithOtp({email:OWNER,options:{emailRedirectTo:location.href.split("#")[0]}});say("loginStatus",error?.message||"پیوند ورود ارسال شد. ایمیل را بررسی کن.")};
sb.auth.onAuthStateChange(()=>setTimeout(show,0));$("logout").onclick=async()=>{await sb.auth.signOut();show()};$("refresh").onclick=load;$("search").oninput=render;$("filter").onchange=render;
async function load(){say("status","در حال دریافت درخواست‌ها…");try{const d=await api({action:"list"});rows=d.requests||[];$("pendingCount").textContent=fa(d.counts?.pending);$("approvedCount").textContent=fa(d.counts?.approved);$("rejectedCount").textContent=fa(d.counts?.rejected);render();if(chosen){const fresh=rows.find(x=>x.id===chosen);if(fresh)select(fresh);else{chosen=null;$("detail").textContent="درخواست پیدا نشد."}}say("status","آخرین به‌روزرسانی: "+new Date().toLocaleString("fa-IR"))}catch(e){say("status",e.message)}}
function statusLabel(s){return s==="approved"?"تأیید و شارژ شده":s==="rejected"?"رد شده":s==="reviewing"?"در حال بررسی":"در انتظار بررسی"}
function render(){const root=$("requests");root.replaceChildren();const q=$("search").value.trim().toLowerCase(),f=$("filter").value;const list=rows.filter(x=>(f==="all"||(f==="pending"?["pending","reviewing"].includes(x.status):x.status===f))&&[x.full_name,x.email,x.request_code,x.phone].some(v=>String(v||"").toLowerCase().includes(q)));if(!list.length){root.innerHTML='<div class="empty">درخواستی با این فیلتر پیدا نشد.</div>';return}list.forEach(x=>{const b=document.createElement("button");b.className="request"+(chosen===x.id?" selected":"");const left=document.createElement("span"),right=document.createElement("span"),name=document.createElement("b"),meta=document.createElement("small"),pill=document.createElement("span");name.textContent=x.full_name+" · "+fa(x.coins)+" سکه";meta.textContent=x.email+" · "+x.request_code;pill.className="pill "+x.status;pill.textContent=statusLabel(x.status);left.append(name,meta);right.append(pill);b.append(left,right);b.onclick=()=>select(x);root.append(b)})}
function addField(root,label,value){const box=document.createElement("div");box.className="field";const l=document.createElement("label");l.textContent=label;const v=document.createElement("div");v.textContent=value||"—";box.append(l,v);root.append(box)}
function select(x){chosen=x.id;$("detailTitle").textContent="درخواست "+x.request_code;const root=$("detail");root.className="";root.replaceChildren();const grid=document.createElement("div");grid.className="detail-grid";addField(grid,"نام و نام خانوادگی",x.full_name);addField(grid,"ایمیل حساب بازی",x.email);addField(grid,"شماره تماس",x.phone);addField(grid,"شناسه حساب",x.user_id||"حساب با ایمیل تطبیق داده می‌شود");addField(grid,"تعداد سکه درخواستی",fa(x.coins)+" سکه");addField(grid,"مبلغ پرداختی",fa(x.amount_toman)+" تومان");addField(grid,"شناسه تراکنش",x.transaction_reference);addField(grid,"کد پیگیری",x.request_code);addField(grid,"تاریخ ثبت",new Date(x.created_at).toLocaleString("fa-IR"));addField(grid,"وضعیت",statusLabel(x.status));root.append(grid);if(x.description){const p=document.createElement("p");p.className="notice";p.textContent="توضیحات: "+x.description;root.append(p)}if(x.receipt_url){const a=document.createElement("a");a.className="receipt";a.href=x.receipt_url;a.target="_blank";a.rel="noopener";a.textContent="مشاهده رسید پرداخت ↗";root.append(a)}const note=document.createElement("textarea");note.id="adminNote";note.placeholder="یادداشت مدیر (اختیاری، برای رد یا تأیید)";note.maxLength=1500;note.style.cssText="display:block;width:100%;margin-top:16px;background:#0b1117;color:#fff;border:1px solid #ffffff20;border-radius:10px;padding:11px;min-height:75px;font:inherit";note.value=x.admin_note||"";root.append(note);const actions=document.createElement("div");actions.className="actions";const approve=document.createElement("button");approve.className="btn primary";approve.textContent="تأیید پرداخت و واریز "+fa(x.coins)+" سکه";approve.disabled=x.status==="approved"||x.status==="rejected";approve.onclick=()=>review(x,"approve");const reject=document.createElement("button");reject.className="btn danger";reject.textContent="رد درخواست";reject.disabled=x.status==="approved"||x.status==="rejected";reject.onclick=()=>review(x,"reject");actions.append(approve,reject);root.append(actions);if(x.status==="approved"){const p=document.createElement("p");p.className="notice";p.textContent="این درخواست تأیید شده و سکه‌ها به حساب بازیکن واریز شده‌اند.";root.append(p)}}
async function review(x,decision){const question=decision==="approve"?"پرداخت را تأیید می‌کنی؟ تعداد "+fa(x.coins)+" سکه به حساب بازی "+x.email+" واریز خواهد شد. این عملیات قابل برگشت نیست.":"این درخواست رد شود؟";if(!confirm(question))return;try{say("status","در حال ثبت تصمیم و بررسی تراکنش…");const d=await api({action:"review",request_id:x.id,decision,admin_note:$("adminNote")?.value||""});say("status",decision==="approve"?"پرداخت تأیید شد و "+fa(d.coins_added)+" سکه واریز شد. موجودی جدید: "+fa(d.new_balance):"درخواست رد شد.");await load()}catch(e){say("status",e.message)}}
show();
</script></body></html>
