<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>پنل مکاتبات</title><style>body{background:#070912;color:#fff;font:16px sans-serif;margin:30px}.box{background:#101426;padding:20px;border-radius:16px;margin:12px 0}input,textarea,button{font:inherit;padding:10px;border-radius:8px}button{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 2fr;gap:12px}.hidden{display:none}.msg{white-space:pre-wrap;padding:10px;background:#080d1a;margin:8px}</style><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>

display:grid;gap:8px}#messages{max-height:50vh;overflow:auto}.hidden{display:none!important}@media(max-width:760px){body{padding:18px 12px 35px}.grid{grid-template-columns:1fr}.grid .box{padding:17px}#login{margin:6vh auto;padding:25px}#messages{max-height:none}.item{font-size:14px}}
</style><style>
:root{--lime:#d6ff59;--lime2:#b9ef28;--ink:#050505;--panel:#10110f;--line:#30342a;--muted:#a9ad9c}
body{background:radial-gradient(ellipse at 50% -20%,#29320d 0,transparent 45%),radial-gradient(ellipse at 100% 45%,#151a08 0,transparent 38%),#050505;color:#f7f8f2}
.box{background:linear-gradient(145deg,rgba(20,22,16,.97),rgba(10,11,9,.98));border:1px solid #d6ff5926;border-radius:25px;box-shadow:0 25px 85px #0009,0 1px 0 #ffffff08 inset}
body>h1{font-weight:800;letter-spacing:-.6px}body>h1:before{content:"";display:inline-block;vertical-align:middle;width:9px;height:35px;border-radius:9px;background:var(--lime);margin-left:12px;box-shadow:0 0 24px #d6ff594d}
#login{position:relative;overflow:hidden;margin:7vh auto;padding:clamp(26px,5vw,44px);border-color:#d6ff5940}
#login:before{content:"";display:block;width:190px;height:190px;margin:0 auto 20px;background:#000 url('https://alishams.ir/assets/alishams-studio-logo.svg') center/contain no-repeat;border:1px solid #d6ff5933;border-radius:25px;box-shadow:0 15px 45px #0008}
#login h2{text-align:center;font-size:25px;letter-spacing:-.5px}#login p{text-align:center;color:#b7b9ad}
input,textarea{background:#080907!important;border:1px solid #3a3d30!important;border-radius:14px!important;padding:15px!important;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--lime)!important;box-shadow:0 0 0 4px #d6ff5917!important;outline:none}
button{border-radius:13px!important;transition:transform .2s,filter .2s!important}button:hover{transform:translateY(-2px);filter:brightness(1.08)}
#loginForm button,#replyForm button{background:linear-gradient(110deg,#d6ff59,#b9ef28)!important;color:#111!important;font-weight:800!important;box-shadow:0 8px 28px #d6ff591b;border:0!important}
#refresh,#logout{background:#ffffff08!important;border:1px solid #d6ff5935!important;color:#f7f8f2!important}
.grid .box{min-height:280px}.item{border:1px solid #ffffff13!important;background:linear-gradient(130deg,#171912,#0b0c09)!important;border-radius:16px!important;padding:15px!important;transition:border-color .2s,transform .2s!important}.item:hover{border-color:#d6ff5980!important;transform:translateY(-2px)}.msg{border:1px solid #ffffff13;border-radius:17px;background:#11120f;padding:15px 17px;line-height:1.95}.msg:nth-child(even){background:#1b2010;border-color:#d6ff5929}#meta{color:#b6baaa}#status,#notice{padding-top:8px;line-height:1.9;overflow-wrap:anywhere}
@media(max-width:760px){body{padding:20px 13px 40px}body>h1{font-size:25px}#login:before{width:155px;height:155px}.box{border-radius:20px}.grid .box{min-height:0}}
 .toolbar-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap} .toolbar-actions button{min-width:105px} #requestControls{max-width:none!important;width:100%;padding:14px!important;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0!important} #requestControls.hidden{display:none!important} #requestControls label{display:flex;gap:8px;align-items:center;flex-wrap:wrap} #requestControls select{max-width:100%} #requestControls button{margin:0} .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0} .stat{border:1px solid #d6ff5926;background:#090a08;border-radius:13px;padding:10px;font-size:13px;line-height:1.8}.stat strong{display:block;color:var(--lime);font-size:22px} #filterStatus{width:100%;font:inherit;padding:12px;border-radius:12px;background:#080907;color:#f7f8f2;border:1px solid #3a3d30;margin:0 0 12px} #searchRequests{margin-bottom:12px!important} 
/* Fix dropdown stacking: keep the requests panel above the adjacent panel while menus are open */
.grid{align-items:start}
.grid>.box:first-child{position:relative;z-index:5;overflow:visible}
.grid>.box:last-child{position:relative;z-index:1;min-width:0}
.admin-select{z-index:10}
.admin-select.open{z-index:100}
.admin-select-menu{z-index:999}
/* Luxury mobile-friendly admin controls */
#searchRequests{width:100%;min-width:0;max-width:100%;height:46px;margin:4px 0 12px!important;padding:10px 13px!important;font-size:13px!important;line-height:1.5;letter-spacing:-.2px;border-radius:13px!important}
#searchRequests::placeholder{font-size:12px;letter-spacing:0;color:#a9ad9c}
#filterStatus.native-filter,#requestStatus.native-filter{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;overflow:hidden!important}
.admin-select{position:relative;width:100%;margin:0 0 14px}
.admin-select-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:right;background:linear-gradient(145deg,#151710,#090a08)!important;color:#f7f8f2!important;border:1px solid #d6ff5935!important;border-radius:14px!important;padding:13px 15px!important;font-size:14px!important;min-height:48px}
.admin-select-trigger:focus-visible,.admin-select.open .admin-select-trigger{outline:none;border-color:#d6ff59!important;box-shadow:0 0 0 4px #d6ff5915}
.admin-select-chevron{color:var(--lime);transition:transform .2s}
.admin-select.open .admin-select-chevron{transform:rotate(180deg)}
.admin-select-menu{display:none;position:absolute;z-index:60;top:calc(100% + 7px);right:0;left:0;max-height:min(300px,45vh);overflow:auto;padding:6px;border:1px solid #d6ff5935;border-radius:16px;background:linear-gradient(145deg,#191b14,#090a08);box-shadow:0 22px 60px #000c;overscroll-behavior:contain}
.admin-select.open .admin-select-menu{display:block;animation:admin-menu-in .16s ease-out}
.admin-select-option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:right;background:transparent!important;color:#e8eadf!important;border:0!important;border-radius:10px!important;padding:12px!important;font-size:13px!important}
.admin-select-option:hover,.admin-select-option:focus-visible{background:#ffffff09!important;outline:none}
.admin-select-option[aria-selected="true"]{background:#d6ff5915!important;color:var(--lime)!important}
.admin-select-check{width:22px;height:22px;display:grid;place-items:center;flex:0 0 22px;border:1px solid #ffffff22;border-radius:7px;color:transparent}
.admin-select-option[aria-selected="true"] .admin-select-check{background:var(--lime);color:#111;border-color:var(--lime)}
#requestControls{display:grid!important;grid-template-columns:minmax(0,1fr);gap:13px!important;padding:18px!important;margin:16px 0!important;border-color:#d6ff5930!important}
#requestControls label{display:flex;flex-direction:column;align-items:stretch;gap:9px;color:#c9cdbb;font-size:13px;font-weight:700}
#requestControls .admin-select{margin:0;width:100%}
#requestControls .control-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:2px}
#requestControls .control-actions button{width:100%;min-width:0;padding:12px 10px!important;font-size:13px!important}
#requestControls .save-status{background:linear-gradient(110deg,#d6ff59,#b9ef28)!important;color:#111!important;border:0!important;box-shadow:0 8px 24px #d6ff5919}
#requestControls .delete-request{background:linear-gradient(145deg,#351714,#21100f)!important;border:1px solid #ff777744!important;color:#ffc3bc!important}
.request-number{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 8px;margin-left:10px;border:1px solid #d6ff5966;border-radius:12px;background:linear-gradient(145deg,#252b14,#11140b);color:#d6ff59;font-family:Vazirmatn,sans-serif;font-size:16px;font-weight:800;box-shadow:0 0 20px #d6ff5910;vertical-align:middle}
.item{display:flex!important;align-items:center;gap:4px}
.item .item-copy{min-width:0;overflow-wrap:anywhere}
.admin-modal-backdrop{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;background:#000b;backdrop-filter:blur(10px)}
.admin-modal-backdrop.show{display:flex}
.admin-modal{width:min(440px,100%);padding:23px;border:1px solid #d6ff5940;border-radius:22px;background:linear-gradient(145deg,#191b14,#090a08);box-shadow:0 28px 100px #000b;animation:admin-menu-in .18s ease-out}
.admin-modal-mark{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:#ff6b5b14;border:1px solid #ff777744;color:#ff9b90;font-size:22px;margin-bottom:14px}
.admin-modal h3{margin:0 0 10px;font-size:19px}
.admin-modal p{color:#b7baad;font-size:13px;line-height:2;margin:0}
.admin-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.admin-modal-actions button{width:100%;font-size:13px!important}
.admin-modal-cancel{background:#ffffff08!important;color:#f7f8f2!important}
.admin-modal-confirm{background:linear-gradient(145deg,#4a1c18,#28100f)!important;border:1px solid #ff777755!important;color:#ffd0ca!important}
@keyframes admin-menu-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@media(max-width:760px){#searchRequests{font-size:12px!important;padding:10px 11px!important}#requestControls{padding:14px!important}#requestControls .control-actions{grid-template-columns:1fr} .request-number{min-width:34px;height:34px;font-size:15px}}
</style></head><body><h1>Alishams · پنل مکاتبات</h1><section id="login" class="box"><h2>ورود مدیر</h2><form id="loginForm"><input id="email" type="email" required placeholder="ایمیل مدیر"><button>ارسال پیوند ورود</button></form><p id="notice"></p></section><section id="app" class="hidden"><div class="box"><div class="toolbar-actions"><button id="refresh">به‌روزرسانی</button><button id="logout">خروج</button></div><p id="status"></p></div><div class="grid"><div class="box"><h2>درخواست‌ها</h2><div id="stats" class="stats"></div><input id="searchRequests" type="search" placeholder="جست‌وجو: نام، ایمیل، موضوع یا کد"><select id="filterStatus" aria-label="فیلتر وضعیت"><option value="all">همهٔ وضعیت‌ها</option><option value="open">باز</option><option value="in_progress">در حال بررسی</option><option value="answered">پاسخ داده‌شده</option><option value="closed">بسته</option></select><div id="requests"></div></div><div class="box"><h2 id="subject"></h2><p id="meta"></p><div id="messages"></div><div id="requestControls" class="hidden"></div><form id="replyForm" class="hidden"><textarea id="reply" maxlength="5000" required></textarea><button>ثبت پاسخ و اعلان ایمیلی</button></form></div></div></section><div class="admin-modal-backdrop" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle"><div class="admin-modal"><div class="admin-modal-mark" aria-hidden="true">!</div><h3 id="deleteModalTitle">حذف دائمی درخواست</h3><p>این درخواست و تمام پیام‌های مرتبط برای همیشه حذف می‌شوند و قابل‌بازیابی نیستند. آیا مطمئنی؟</p><div class="admin-modal-actions"><button type="button" class="admin-modal-cancel" id="cancelDelete">انصراف</button><button type="button" class="admin-modal-confirm" id="confirmDelete">بله، حذف شود</button></div></div></div><script type="module" src="admin-inbox.js?v=5"></script></body></html>
