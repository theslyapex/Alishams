<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>پنل مکاتبات</title><style>body{background:#070912;color:#fff;font:16px sans-serif;margin:30px}.box{background:#101426;padding:20px;border-radius:16px;margin:12px 0}input,textarea,button{font:inherit;padding:10px;border-radius:8px}button{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 2fr;gap:12px}.hidden{display:none}.msg{white-space:pre-wrap;padding:10px;background:#080d1a;margin:8px}</style></head><body><h1>Alishams · پنل مکاتبات</h1><section id="login" class="box"><h2>ورود مدیر</h2><form id="loginForm"><input id="email" type="email" required placeholder="ایمیل مدیر"><button>ارسال پیوند ورود</button></form><p id="notice"></p></section><section id="app" class="hidden"><div class="box"><button id="refresh">به‌روزرسانی</button><button id="logout">خروج</button><p id="status"></p></div><div class="grid"><div class="box"><h2>درخواست‌ها</h2><div id="requests"></div></div><div class="box"><h2 id="subject"></h2><p id="meta"></p><div id="messages"></div><form id="replyForm" class="hidden"><textarea id="reply" maxlength="5000" required></textarea><button>ثبت پاسخ و اعلان ایمیلی</button></form></div></div></section><script type="module" src="admin-inbox.js"></script></body></html>
