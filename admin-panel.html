<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>پنل مکاتبات</title><style>body{background:#070912;color:#fff;font:16px sans-serif;margin:30px}.box{background:#101426;padding:20px;border-radius:16px;margin:12px 0}input,textarea,button{font:inherit;padding:10px;border-radius:8px}button{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 2fr;gap:12px}.hidden{display:none}.msg{white-space:pre-wrap;padding:10px;background:#080d1a;margin:8px}</style><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px 55px;font-family:Vazirmatn,sans-serif;background:radial-gradient(ellipse at 10% 5%,#17214a,transparent 40%),radial-gradient(ellipse at 90% 15%,#24153d,transparent 35%),#070912;color:#f4f6ff}body>h1{max-width:1180px;margin:0 auto 24px;font-size:clamp(24px,4vw,34px)}.box{background:rgba(18,23,43,.9);border:1px solid #ffffff18;padding:clamp(18px,3vw,28px);border-radius:22px;margin:14px auto;max-width:1180px;box-shadow:0 22px 70px #0004;backdrop-filter:blur(18px)}#login{max-width:460px;margin:8vh auto;padding:32px}h2{font-size:21px;margin:0 0 18px}p{line-height:1.9}input,textarea{display:block;width:100%;background:#080d1b!important;color:#f4f6ff!important;border:1px solid #343c59!important;border-radius:13px!important;padding:13px!important;font-family:inherit!important;margin:10px 0 14px}button{font-family:inherit!important;border:1px solid #ffffff20!important;border-radius:12px!important;padding:12px 17px!important;cursor:pointer!important;font-weight:700!important;transition:.2s}button:hover{filter:brightness(1.12);transform:translateY(-1px)}#loginForm button,#replyForm button{background:linear-gradient(110deg,#58d9ee,#a78bfa)!important;color:#07101b!important;border:0!important}#refresh,#logout{background:#ffffff0a!important;color:#f4f6ff!important}.grid{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.7fr);gap:16px}.grid .box{width:100%;min-width:0;margin:0}.item{display:block;width:100%;text-align:right;line-height:1.8;background:#080d1b!important;color:#f4f6ff!important;border:1px solid #ffffff16!important;margin:7px 0;overflow-wrap:anywhere}.msg{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;padding:13px 15px;background:#080d1b;border:1px solid #ffffff12;border-radius:14px;margin:9px 0;font-size:14px}#meta{color:#a5aec8;font-size:13px;overflow-wrap:anywhere}#status,#notice{color:#a5aec8;overflow-wrap:anywhere}textarea{min-height:120px;resize:vertical}#requests{display:grid;gap:8px}#messages{max-height:50vh;overflow:auto}.hidden{display:none!important}@media(max-width:760px){body{padding:18px 12px 35px}.grid{grid-template-columns:1fr}.grid .box{padding:17px}#login{margin:6vh auto;padding:25px}#messages{max-height:none}.item{font-size:14px}}
</style></head><body><h1>Alishams · پنل مکاتبات</h1><section id="login" class="box"><h2>ورود مدیر</h2><form id="loginForm"><input id="email" type="email" required placeholder="ایمیل مدیر"><button>ارسال پیوند ورود</button></form><p id="notice"></p></section><section id="app" class="hidden"><div class="box"><button id="refresh">به‌روزرسانی</button><button id="logout">خروج</button><p id="status"></p></div><div class="grid"><div class="box"><h2>درخواست‌ها</h2><div id="requests"></div></div><div class="box"><h2 id="subject"></h2><p id="meta"></p><div id="messages"></div><form id="replyForm" class="hidden"><textarea id="reply" maxlength="5000" required></textarea><button>ثبت پاسخ و اعلان ایمیلی</button></form></div></div></section><script type="module" src="admin-inbox.js"></script></body></html>
