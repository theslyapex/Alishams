<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090b0d">
<title>مرکز فرماندهی مدیریت | Alishams Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#080a0c;--panel:#11151a;--panel2:#151a20;--line:#ffffff13;--lime:#d6ff59;--purple:#b7a0ff;--cyan:#58d9ee;--muted:#9da6b2;--text:#f5f7f8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}
button{font:inherit;cursor:pointer}.app{height:100dvh;display:grid;grid-template-columns:270px minmax(0,1fr);grid-template-rows:76px minmax(0,1fr);background:radial-gradient(ellipse at 15% 0%,#b7a0ff10,transparent 36%),radial-gradient(ellipse at 85% 5%,#d6ff5910,transparent 32%),#080a0c}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 24px;border-bottom:1px solid var(--line);background:#0c0f13eF;backdrop-filter:blur(18px);z-index:3}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{width:42px;height:42px;border:1px solid #d6ff5955;border-radius:13px;background:#111 url('/assets/alishams-studio-logo.svg') center/contain no-repeat;box-shadow:0 0 28px #d6ff5916}.brand strong{font-size:15px;letter-spacing:.4px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.3px}
.topright{display:flex;align-items:center;gap:10px}.secure{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #d6ff5925;border-radius:30px;background:#d6ff5908;color:#cce98a;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime)}.site{color:#dfe4e8;text-decoration:none;font-size:12px;padding:9px 13px;border:1px solid var(--line);border-radius:11px}
.sidebar{grid-row:2;grid-column:1;padding:20px 14px;border-left:1px solid var(--line);background:linear-gradient(180deg,#101419,#0b0e11);overflow:auto}
.side-label{font-size:9px;font-weight:800;color:#707c89;letter-spacing:1.6px;padding:5px 12px 12px}.nav{display:grid;gap:6px}.nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;text-align:right;color:#aeb7c1;border:1px solid transparent;border-radius:13px;background:transparent;font-size:12px;transition:.18s}.nav button:hover{background:#ffffff08;color:#fff}.nav button.active{color:#f7f9f2;background:linear-gradient(110deg,#d6ff5918,#b7a0ff0b);border-color:#d6ff5933;box-shadow:inset -3px 0 var(--lime)}.ico{width:31px;height:31px;display:grid;place-items:center;border-radius:10px;background:#ffffff09;color:#c9d0d8;font-size:16px;flex:0 0 31px}.nav button.active .ico{background:#d6ff5918;color:var(--lime)}.nav-copy{min-width:0}.nav-copy b{display:block;font-size:12px;font-weight:700}.nav-copy small{display:block;color:#74808d;font-size:9px;margin-top:2px}.side-foot{margin-top:24px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#ffffff05;color:#8994a0;font-size:10px;line-height:2}
.workspace{grid-row:2;grid-column:2;min-width:0;min-height:0;display:flex;flex-direction:column;padding:15px 17px 17px;gap:11px}.workspace-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:43px}.crumb{font-size:11px;color:var(--muted)}.crumb strong{color:#f3f5f6;font-size:14px;margin-left:8px}.reload{border:1px solid var(--line);background:#ffffff08;color:#e9edf0;border-radius:10px;padding:8px 12px;font-size:11px}.frame-wrap{flex:1;min-height:0;position:relative;border:1px solid #ffffff18;border-radius:17px;overflow:hidden;background:#090b0d;box-shadow:0 20px 70px #0005}.frame-wrap:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--lime),var(--purple),transparent);z-index:1;opacity:.65}iframe{display:block;width:100%;height:100%;border:0;background:#080a0c}
@media(max-width:850px){.app{grid-template-columns:1fr;grid-template-rows:64px 68px minmax(0,1fr)}.topbar{grid-row:1;padding:0 13px}.logo{width:36px;height:36px}.brand strong{font-size:13px}.secure{font-size:0;padding:9px}.secure .dot{margin:0}.site{padding:8px 10px}.sidebar{grid-row:2;grid-column:1;border-left:0;border-bottom:1px solid var(--line);padding:8px 10px;overflow-x:auto;overflow-y:hidden}.side-label,.side-foot{display:none}.nav{display:flex;gap:7px;width:max-content}.nav button{width:auto;min-width:106px;padding:8px 10px;gap:7px}.ico{width:28px;height:28px;flex-basis:28px}.nav-copy b{font-size:10px}.nav-copy small{display:none}.workspace{grid-row:3;grid-column:1;padding:10px;gap:7px}.workspace-head{min-height:32px}.frame-wrap{border-radius:13px}}
@media(max-width:420px){.brand small{font-size:8px}.topright{gap:5px}.site{font-size:10px}.nav button{min-width:96px}.nav-copy b{font-size:9px}}

/* Responsive hardening */
.nav{min-width:0}
.nav button{min-width:0;white-space:normal}
.nav-copy{overflow-wrap:anywhere}
.topbar,.topright,.brand{min-width:0}
.workspace,.frame-wrap{min-width:0;min-height:0}
iframe{min-width:0}
@media(max-width:850px){
 .app{height:100svh;height:100dvh;grid-template-columns:minmax(0,1fr);grid-template-rows:62px 66px minmax(0,1fr);overflow:hidden}
 .topbar{min-width:0;gap:8px;padding-inline:10px}
 .brand{gap:8px;flex:1 1 auto}
 .brand strong{font-size:12px;white-space:nowrap}
 .brand small{font-size:8px;letter-spacing:.7px;white-space:nowrap}
 .topright{flex:0 0 auto;gap:6px}
 .secure{font-size:0;width:30px;height:30px;justify-content:center;padding:0;flex:0 0 30px}
 .secure .dot{margin:0}
 .site{font-size:10px;white-space:nowrap;padding:7px 9px}
 .sidebar{min-width:0;width:100%;padding:7px 9px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-width:none}
 .sidebar::-webkit-scrollbar{display:none}
 .nav{display:flex;flex-wrap:nowrap;gap:7px;width:max-content;min-width:100%}
 .nav button{flex:0 0 auto;width:auto;min-width:116px;max-width:145px;min-height:48px;padding:6px 9px;gap:7px;white-space:nowrap}
 .nav-copy{min-width:0}
 .nav-copy b{font-size:10px;white-space:nowrap}
 .workspace{padding:8px;gap:7px;overflow:hidden}
 .workspace-head{flex:0 0 34px;min-height:34px}
 .crumb strong{font-size:12px}
 .reload{font-size:10px;padding:7px 9px;white-space:nowrap}
 .frame-wrap{flex:1 1 auto;width:100%;min-height:0;overflow:hidden}
}
@media(max-width:380px){
 .brand strong{font-size:10px}
 .brand small{font-size:7px}
 .logo{width:31px;height:31px;flex:0 0 31px}
 .site{font-size:9px;padding:6px 7px}
 .nav button{min-width:108px}
}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="logo" aria-hidden="true"></div><div><strong>ALISHAMS STUDIO</strong><small>UNIFIED MANAGEMENT CENTER</small></div></div><div class="topright"><span class="secure"><i class="dot"></i> محیط مدیریتی امن</span><a class="site" href="/" target="_blank" rel="noopener">مشاهده سایت ↗</a></div></header>
<aside class="sidebar"><div class="side-label">مرکز مدیریت استودیو</div><nav class="nav" id="mainNav">
<button class="active" data-key="dashboard" data-src="admin.html"><span class="ico">▦</span><span class="nav-copy"><b>داشبورد اصلی</b><small>آمار و کنترل کلی</small></span></button>
<button data-key="orders" data-src="orders-admin.html"><span class="ico">▤</span><span class="nav-copy"><b>سفارش‌ها</b><small>ثبت، بررسی و تبدیل سفارش</small></span></button>
<button data-key="projects" data-src="admin-projects.html"><span class="ico">◫</span><span class="nav-copy"><b>پروژه‌ها</b><small>وضعیت، پرداخت و تحویل</small></span></button>
<button data-key="messages" data-src="admin-messages.html"><span class="ico">✉</span><span class="nav-copy"><b>مکاتبات و پیام‌ها</b><small>صندوق درخواست و پاسخ‌ها</small></span></button>
<button data-key="videos" data-src="videos-admin.html"><span class="ico">▷</span><span class="nav-copy"><b>مدیریت ویدئوها</b><small>انتشار و آمار بازدید</small></span></button>
<button data-key="comments" data-src="comments-admin.html"><span class="ico">☷</span><span class="nav-copy"><b>دیدگاه‌ها</b><small>تأیید، پنهان و مدیریت</small></span></button>
<button data-key="portfolio" data-src="portfolio-admin.html"><span class="ico">▧</span><span class="nav-copy"><b>نمونه‌کارها</b><small>گالری و محتوای نمونه‌کار</small></span></button>
</nav><div class="side-foot">تمام ابزارهای مدیریتی در یک فضای یکپارچه گردآوری شده‌اند. دسترسی هر بخش مطابق مجوز و ورود امن همان بخش کنترل می‌شود.</div></aside>
<main class="workspace"><div class="workspace-head"><div class="crumb"><strong id="moduleTitle">داشبورد اصلی</strong><span> / مرکز فرماندهی</span></div><button class="reload" id="reloadModule">بارگذاری مجدد ↻</button></div><div class="frame-wrap"><iframe id="moduleFrame" title="بخش مدیریت انتخاب‌شده" src="admin.html"></iframe></div></main>
</div>
<script>
(function(){
const nav=document.getElementById('mainNav'),frame=document.getElementById('moduleFrame'),title=document.getElementById('moduleTitle'),reload=document.getElementById('reloadModule');
const names={dashboard:'داشبورد اصلی',orders:'مدیریت سفارش‌ها',projects:'مدیریت پروژه‌ها',messages:'مکاتبات و پیام‌ها',videos:'مدیریت ویدئوها',comments:'مدیریت دیدگاه‌ها',portfolio:'مدیریت نمونه‌کارها'};
let current='dashboard';
function activate(key,src,updateHash=true){const btn=nav.querySelector('[data-key="'+key+'"]');if(!btn)return;current=key;nav.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===btn));title.textContent=names[key];if(frame.getAttribute('src')!==src)frame.src=src;if(updateHash)history.replaceState(null,'','#'+key)}
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(b)activate(b.dataset.key,b.dataset.src)});
reload.addEventListener('click',()=>{try{frame.contentWindow.location.reload()}catch{frame.src=frame.src}});
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='alishams-admin-nav')return;const b=nav.querySelector('[data-src="'+e.data.path.replace(/^\//,'')+'"]');if(b)activate(b.dataset.key,b.dataset.src)});
frame.addEventListener('load',()=>{try{
 const doc=frame.contentDocument;
 if(!doc.querySelector('meta[name="viewport"]')){const meta=doc.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1,viewport-fit=cover';doc.head.appendChild(meta)}
 if(!doc.getElementById('unified-admin-mobile-fix')){const style=doc.createElement('style');style.id='unified-admin-mobile-fix';style.textContent=`
 @media(max-width:850px){
 html,body{max-width:100%!important;overflow-x:hidden!important}
 *,*:before,*:after{box-sizing:border-box}
 img,video,canvas,svg{max-width:100%;height:auto}
 table{display:block;max-width:100%;overflow-x:auto}
 input,select,textarea{max-width:100%;min-width:0}
 button{max-width:100%;white-space:normal;overflow-wrap:anywhere}
 .container,.wrapper,.content,.main-content,.admin-container,.dashboard-container{width:100%!important;max-width:100%!important;min-width:0!important}
 .grid,.stats-grid,.cards-grid,.dashboard-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))!important}
 .actions,.toolbar,.filters,.header-actions{display:flex;flex-wrap:wrap;gap:8px}
 }
 `;doc.head.appendChild(style)}
 doc.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const path=new URL(a.href,location.href).pathname.split('/').pop();const b=nav.querySelector('[data-src="'+path+'"]');if(b){e.preventDefault();activate(b.dataset.key,b.dataset.src)}},true)
 }catch(e){console.warn('Admin module mobile enhancement:',e)}});
const initial=location.hash.slice(1);const btn=nav.querySelector('[data-key="'+initial+'"]');if(btn)activate(btn.dataset.key,btn.dataset.src,false);
})();
</script></body></html>
