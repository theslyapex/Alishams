:root{--lime:#d6ff59;--lime2:#b9ef28;--ink:#050505;--panel:#10110f;--line:#30342a;--muted:#a9ad9c}
body{background:radial-gradient(ellipse at 50% -20%,#29320d 0,transparent 45%),radial-gradient(ellipse at 100% 45%,#151a08 0,transparent 38%),#050505;color:#f7f8f2}
.box{background:linear-gradient(145deg,rgba(20,22,16,.97),rgba(10,11,9,.98));border:1px solid #d6ff5926;border-radius:25px;box-shadow:0 25px 85px #0009,0 1px 0 #ffffff08 inset}

#login{position:relative;overflow:hidden;margin:7vh auto;padding:clamp(26px,5vw,44px);border-color:#d6ff5940}

button{border-radius:13px!important;transition:transform .2s,filter .2s!important}button:hover{transform:translateY(-2px);filter:brightness(1.08)}
#loginForm button,#replyForm button{background:linear-gradient(110deg,#d6ff59,#b9ef28)!important;color:#111!important;font-weight:800!important;box-shadow:0 8px 28px #d6ff591b;border:0!important}
#refresh,#logout{background:#ffffff08!important;border:1px solid #d6ff5935!important;color:#f7f8f2!important}
.grid .box{min-height:280px}.item{border:1px solid #ffffff13!important;background:linear-gradient(130deg,#171912,#0b0c09)!important;border-radius:16px!important;padding:15px!important;transition:border-color .2s,transform .2s!important}.item:hover{border-color:#d6ff5980!important;transform:translateY(-2px)}.msg{border:1px solid #ffffff13;border-radius:17px;background:#11120f;padding:15px 17px;line-height:1.95}.msg:nth-child(even){background:#1b2010;border-color:#d6ff5929}#meta{color:#b6baaa}#status,#notice{padding-top:8px;line-height:1.9;overflow-wrap:anywhere}

 .toolbar-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap} .toolbar-actions button{min-width:105px} #requestControls{max-width:none!important;width:100%;padding:14px!important;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0!important} #requestControls.hidden{display:none!important} #requestControls label{display:flex;gap:8px;align-items:center;flex-wrap:wrap} #requestControls select{max-width:100%} #requestControls button{margin:0} .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0} .stat{border:1px solid #d6ff5926;background:#090a08;border-radius:13px;padding:10px;font-size:13px;line-height:1.8}.stat strong{display:block;color:var(--lime);font-size:22px} #filterStatus{width:100%;font:inherit;padding:12px;border-radius:12px;background:#080907;color:#f7f8f2;border:1px solid #3a3d30;margin:0 0 12px} #searchRequests{margin-bottom:12px!important} </style></head><body><h1>Alishams · پنل مکاتبات</h1><section id="login" class="box"><h2>ورود مدیر</h2><form id="loginForm"><input id="email" type="email" required placeholder="ایمیل مدیر"><button>ارسال پیوند ورود</button></form><p id="notice"></p></section><section id="app" class="hidden"><div class="box"><div class="toolbar-actions"><button id="refresh">به‌روزرسانی</button><button id="logout">خروج</button></div><p id="status"></p></div><div class="grid"><div class="box"><h2>درخواست‌ها</h2><div id="stats" class="stats"></div><input id="searchRequests" type="search" placeholder="جست‌وجو در نام، ایمیل، موضوع یا کد پیگیری"><select id="filterStatus" aria-label="فیلتر وضعیت"><option value="all">همهٔ وضعیت‌ها</option><option value="open">باز</option><option value="in_progress">در حال بررسی</option><option value="answered">پاسخ داده‌شده</option><option value="closed">بسته</option></select><div id="requests"></div></div><div class="box"><h2 id="subject"></h2><p id="meta"></p><div id="messages"></div><div id="requestControls" class="hidden"></div><form id="replyF
